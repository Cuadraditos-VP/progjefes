<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Jefes</title>
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jefes">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d0d7de;
      --header-bg: #1e3a5f;
      --name-col: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #1f2937;
      line-height: 1.4;
      padding: 16px 8px 60px;
    }
    .container {
      max-width: none;
      margin: 0 auto;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; margin-bottom: 8px; width: 100%; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #1e3a5f; }
    header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }
    .title-short { display: none; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .view-original-btn {
      margin-top: 0;
      border: 0;
      border-radius: 7px;
      padding: 7px 12px;
      background: #7c3aed;
      color: white;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
    }
    footer { display: none !important; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 10px 0 4px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px 3px 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #334155;
    }
    .legend-item .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .group {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 0 auto 24px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 100%;
    }
    .group-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
      color: white;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .group-header span {
      background: rgba(255,255,255,0.18);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 0;
      font-size: 0.75rem;
    }
    thead th {
      background: var(--header-bg);
      color: #fff;
      font-weight: 600;
      padding: 8px 3px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 45;
      border-bottom: 2px solid #0f2744;
      white-space: nowrap;
      height: 52px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    /* Encabezados de día (fecha/número) en gris medio, con el finde suavizado */
    thead th:not(.sticky-col):not(.sticky-col-2) {
      background: #64748b;
      border-bottom: 2px solid #475569;
    }
    thead th.day-num { font-size: 0.85rem; font-weight: 500; }
    thead th.weekend { background: #94a3b8; }
    th.sticky-col, td.sticky-col {
      position: sticky; left: 0; z-index: 10; background: var(--name-col);
    }
    th.sticky-col-2, td.sticky-col-2 {
      position: sticky; left: 68px; z-index: 10; background: var(--name-col);
      border-right: 2px solid var(--border);
    }
    th.sticky-col, td.sticky-col {
      left: 0;
      z-index: 25;
    }
    th.sticky-col {
      background: var(--header-bg);
    }
    th.sticky-col-2, td.sticky-col-2 {
      left: var(--col-legajo);
      z-index: 25;
    }
    th.sticky-col-2 {
      background: var(--header-bg); text-align: left; padding-left: 8px;
    }
    tbody td {
      text-align: center;
      padding: 6px 3px;
      border: 1px solid #e5e7eb;
      font-weight: 600;
      font-size: 1.05rem;
      min-width: 48px;
      height: 39px;
      box-sizing: border-box;
      cursor: pointer;
      transition: filter 0.1s;
    }
    tbody td:hover { filter: brightness(0.93); }
    tbody tr:nth-child(even) td.sticky-col,
    tbody tr:nth-child(even) td.sticky-col-2 { background: #f1f5f9; }
    td.sticky-col {
      font-weight: 600; color: #475569; font-size: 0.72rem; border-right: none;
    }
    td.sticky-col-2 {
      text-align: left; padding-left: 8px; font-weight: 600;
      color: #1e293b; font-size: 0.78rem; white-space: nowrap;
    }
    td.empty { background: #fafafa; color: #cbd5e1; cursor: default; }
    td.empty:hover { filter: none; }

    [data-code] {
      background: #f1f5f9;
      color: #334155;
    }

    .palette-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .palette-overlay.open { display: flex !important; }
    #shiftOverlay { z-index: 1100; }
    .palette-modal {
      background: white;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      padding: 18px;
    }
    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .palette-header h3 {
      font-size: 1rem;
      color: #1e293b;
    }
    .palette-header .code-badge {
      background: #1e3a5f;
      color: white;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #64748b;
      line-height: 1;
    }
    .close-btn:hover { background: #e2e8f0; color: #1e293b; }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .shift-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .shift-option {
      padding: 12px 4px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: center;
      background: #f1f5f9;
      color: #334155;
      transition: transform 0.12s, border-color 0.12s;
      user-select: none;
    }
    .shift-option:hover { transform: scale(1.05); border-color: #1e293b; }
    .shift-option.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.4);
    }
    #originalBanner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #78350f;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
      width: 100%;
    }
    .palette-color {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      position: relative;
    }
    .palette-color:hover {
      transform: scale(1.08);
      border-color: #1e293b;
    }
    .palette-color.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.4);
    }
    .palette-color .hex-label {
      position: absolute;
      bottom: 2px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.55rem;
      font-weight: 600;
      color: rgba(0,0,0,0.55);
      text-shadow: 0 0 3px white;
      pointer-events: none;
    }
    .palette-actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-clear {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-clear:hover { background: #e2e8f0; }
    .btn-done {
      background: #1e3a5f;
      color: white;
    }
    .btn-done:hover { background: #16304f; }

    .group-body {
      display: flex;
      gap: 0;
      align-items: stretch;
    }
    .group-body .table-wrap {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
    }
    .group-body .counts-wrap {
      flex: 0 0 auto;
      border-left: 3px solid #1e3a5f;
      overflow: hidden;
    }
    .group-body .counts-wrap table {
      min-width: 0;
      width: auto;
      border-collapse: collapse;
    }
    /* Match EXACTLY the main table cell metrics */
    .group-body .counts-wrap thead th {
      background: #2a4a73;
      color: #fff;
      font-weight: 600;
      font-size: 0.65rem;
      padding: 7px 2px;
      text-align: center;
      border-bottom: 2px solid #0f2744;
      white-space: nowrap;
      min-width: 30px;
      width: 30px;
      line-height: 1.25;
      height: 40px;          /* approx 2-line header height */
      box-sizing: border-box;
    }
    .group-body .counts-wrap tbody td {
      text-align: center;
      padding: 4px 2px;
      border: 1px solid #e5e7eb;
      font-weight: 600;
      font-size: 0.7rem;
      min-width: 30px;
      width: 30px;
      height: 26px;
      box-sizing: border-box;
    }
    /* Force main table body cells to same fixed height */
    .group-body .table-wrap tbody td {
      height: 26px;
      box-sizing: border-box;
    }
    .group-body .table-wrap thead th {
      height: 40px;
      box-sizing: border-box;
    }
    .hint {

      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    footer {
      text-align: center;
      margin-top: 12px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  
    #summaryTable {
      table-layout: auto;
    }
    #summaryTable thead th:not(.sticky-col):not(.sticky-col-2) {
      min-width: 30px;
      width: 30px;
    }
    #summaryTable tbody td:not(.sticky-col):not(.sticky-col-2) {
      min-width: 30px;
      width: 30px;
      height: 26px;
      box-sizing: border-box;
    }

  
    /* ========== STRICT COLUMN ALIGNMENT ========== */
    :root {
      --col-legajo: 68px;
      --col-nombre: 130px;
      --col-day: 42px;
      --days-total: 1260px; /* 30 * 42 */
    }

    table {
      table-layout: fixed;
      border-collapse: collapse;
    }

    /* Sticky columns – same everywhere */
    th.sticky-col, td.sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
      width: var(--col-legajo) !important;
      min-width: var(--col-legajo) !important;
      max-width: var(--col-legajo) !important;
      box-sizing: border-box;
    }
    th.sticky-col {
      background: var(--header-bg);
      z-index: 25;
    }
    td.sticky-col {
      background: var(--name-col);
    }
    tbody tr:nth-child(even) td.sticky-col {
      background: #f1f5f9;
    }

    th.sticky-col-2, td.sticky-col-2 {
      position: sticky;
      left: var(--col-legajo);
      z-index: 10;
      width: var(--col-nombre) !important;
      min-width: var(--col-nombre) !important;
      max-width: var(--col-nombre) !important;
      box-sizing: border-box;
      border-right: 2px solid var(--border);
    }
    th.sticky-col-2 {
      background: var(--header-bg);
      z-index: 25;
      text-align: left;
      padding-left: 8px;
    }
    td.sticky-col-2 {
      background: var(--name-col);
      text-align: left;
      padding-left: 8px;
    }
    tbody tr:nth-child(even) td.sticky-col-2 {
      background: #f1f5f9;
    }

    /* Separador de semana (entre DO y LU) — nunca corta un bloque LAO, porque ese bloque es una sola celda */
    .week-sep {
      border-left: 3px solid #334155 !important;
    }
    /* Bloque de vacaciones (LAO) fusionado en una sola celda */
    td.lao-block {
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }

    /* Day columns – identical width everywhere (main + summary) */
    thead th:not(.sticky-col):not(.sticky-col-2),
    tbody td:not(.sticky-col):not(.sticky-col-2) {
      width: var(--col-day) !important;
      min-width: var(--col-day) !important;
      max-width: var(--col-day) !important;
      box-sizing: border-box;
      padding: 6px 2px;
      overflow: hidden;
    }
    thead th:not(.sticky-col):not(.sticky-col-2) {
      padding: 8px 2px;
      height: 52px;
    }
    tbody td:not(.sticky-col):not(.sticky-col-2) {
      height: 39px;
    }

    /* Main schedule tables width = sticky + sticky2 + días del mes (--days-total lo fija el JS) */
    .group-body .table-wrap table {
      width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      min-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      max-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
    }

    /* Summary table same width formula */
    #summaryTable {
      width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      min-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
    }

    /* Side counts – fixed narrow columns, do not affect day alignment */
    .group-body {
      display: flex;
      align-items: flex-start;
      gap: 0;
      padding: 0;
    }
    .group-body .table-wrap {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Conteo por jefe: se muestra como tabla independiente, separada de la programación */
    .group-body .counts-wrap {
      flex: 0 0 auto;
      margin-left: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow: hidden;
      background: #fff;
    }
    .group-body .counts-wrap table {
      width: auto;
      table-layout: fixed;
    }
    .group-body .counts-wrap thead th {
      background: #2a4a73;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      width: 42px !important;
      min-width: 42px !important;
      max-width: 42px !important;
      padding: 8px 2px;
      box-sizing: border-box;
      border: 1px solid transparent;
      border-bottom: 2px solid #0f2744;
      line-height: 1.25;
      vertical-align: middle;
    }
    .group-body .counts-wrap tbody td {
      width: 42px !important;
      min-width: 42px !important;
      max-width: 42px !important;
      padding: 6px 2px;
      box-sizing: border-box;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      border: 1px solid #e5e7eb;
      vertical-align: middle;
    }
    .group-body .counts-wrap tbody tr:last-child td { border-bottom: none; }
    .group-body .counts-wrap tbody td:last-child { border-right: none; }

  
    /* Toggle buttons */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e3a5f;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin: 4px 6px 4px 0;
    }
    .toggle-btn:hover { background: #16304f; }
    .toggle-btn .arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 0.75rem;
    }
    .toggle-btn.collapsed .arrow { transform: rotate(-90deg); }
    .toggle-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 14px;
      align-items: center;
    }
    .collapsible.hidden-section { display: none !important; }
    .counts-wrap.hidden-section { display: none !important; }

  
    .gnum {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

  
    /* Frozen name panel */
    th.sticky-col, td.sticky-col,
    th.sticky-col-2, td.sticky-col-2 {
      position: sticky !important;
      z-index: 30 !important;
      box-shadow: 2px 0 6px rgba(0,0,0,0.08);
    }
    th.sticky-col, th.sticky-col-2 {
      z-index: 40 !important;
      background: var(--header-bg) !important;
    }
    td.sticky-col, td.sticky-col-2 {
      background: #f8fafc !important;
    }
    tbody tr:nth-child(even) td.sticky-col,
    tbody tr:nth-child(even) td.sticky-col-2 {
      background: #eef2f7 !important;
    }

  
    #perPersonTable thead th[data-code],
    #perPersonTable tbody td[data-code] {
      min-width: 42px;
      width: 42px;
      text-align: center;
    }
    #perPersonTable {
      table-layout: auto;
    }

  
    /* ===== VERSIÓN SIMPLE / CELULAR ===== */
    html, body {
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
    }
    body {
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 100%;
      height: 100dvh;
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      margin: 0 auto;
      flex: 0 0 auto;
      width: 100%;
    }
    .topbar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    header h1 { font-size: 1.05rem; }
    header p { display: none; }
    .view-original-btn { font-size: 0.72rem; padding: 6px 10px; }
    .json-btn {
      border: 0; border-radius: 6px; padding: 5px 8px;
      background: #1e3a5f; color: #fff; font-size: 0.68rem;
      font-weight: 700; cursor: pointer;
    }
    body:not(.is-admin) .admin-only { display: none !important; }
    .user-btn {
      width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%;
      background: #334155; color: #fff; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    body.is-admin .user-btn { background: #16a34a; }
    .user-btn svg { width: 18px; height: 18px; fill: currentColor; }
    #loginOverlay {
      display: none; position: fixed; inset: 0; z-index: 80;
      background: rgba(15,23,42,.55); align-items: center; justify-content: center;
      padding: 16px;
    }
    #loginOverlay.open { display: flex; }
    .login-box {
      width: 100%; max-width: 280px; background: #fff;
      border-radius: 14px; padding: 16px;
    }
    .login-box h2 { font-size: 0.95rem; margin-bottom: 10px; color: #1e3a5f; }
    .login-box input {
      width: 100%; margin: 6px 0; padding: 10px;
      border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem;
    }
    .login-box button {
      width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px;
      background: #1e3a5f; color: #fff; font-weight: 700; cursor: pointer;
    }
    .login-err { color: #b91c1c; font-size: 0.78rem; min-height: 1em; }
    #groupSection1.group,
    .group {
      margin: 0 auto !important;
      border-radius: 0;
      flex: 1 1 auto;
      min-height: 0;
      width: max-content;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .group-body {
      padding: 0;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 100vw;
      display: block !important;
    }
    .group-body .table-wrap {
      overflow-x: auto !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      max-width: 100vw;
      min-width: 0;
      height: 100%;
      margin: 0 auto;
    }
    .group-body .table-wrap table {
      margin-left: auto;

    @keyframes titilar {

        box-shadow: none;
      }
      50% {
        opacity: 1;
        border-color: #b45309;

      border: 3px solid transparent;

      animation-fill-mode: forwards;
      pointer-events: none;
      z-index: 2;

      { id: "60823", name: "PEREYRA", codes: "NC NC N T F NC NC N T M F F NC N NC NC N T M F F N NC N T T M F F NC N".split(" ") },
    ];

    const SEED_BY_MES = { "2026-09": SEED_SEP, "2026-10": SEED_OCT };

    let people = SEED_BY_MES[FIRST_MES].map(p => ({ id: p.id, name: p.name, codes: p.codes.slice() }));

    // Snapshot de la programación INICIAL del mes: nunca se pisa,
    // ni al cargar un JSON nuevo ni al hacer ediciones. Sirve para poder
    // volver a ver siempre el punto de partida original.
    let INITIAL_CODES = people.map(p => p.codes.slice());

    // Snapshot de la programación OFICIAL más reciente (la última publicada
    // en GitHub). A diferencia de INITIAL_CODES, esta SÍ se actualiza cada
    // vez que se carga o importa un JSON nuevo; se usa para marcar qué
    // celdas quedaron editadas localmente sin publicar todavía.
    let ORIGINAL_CODES = people.map(p => p.codes.slice());

    // Ediciones locales: se guardan por mes (septiembre conserva su clave de siempre)
    function editsKey(mes) { return mes === FIRST_MES ? "ctEditsMap" : "ctEditsMap:" + mes; }
    let editsMap = {};
    function loadEdits() {
      try { editsMap = JSON.parse(localStorage.getItem(editsKey(currentMes)) || "{}"); } catch (e) { editsMap = {}; }
    }

    function applyLocalEdits() {
      Object.keys(editsMap).forEach(key => {
        const [pi, di] = key.split(":").map(Number);
        if (people[pi] && ORIGINAL_CODES[pi]) {
          people[pi].codes[di] = editsMap[key];
        }
      });
    }

    function resetPeopleFromOfficial() {
      people = people.map((p, i) => ({
        id: p.id,
        name: p.name,
        codes: (ORIGINAL_CODES[i] ? ORIGINAL_CODES[i].slice() : (p.codes || []).slice())
      }));
      applyLocalEdits();
    }

    // Modo de vista: "actual" (editable), "oficial" (última publicada, solo lectura)
    // o "inicial" (la programación de arranque del mes, solo lectura)
    let viewMode = "actual";
    let selectedDay = null; // índice de día (0-based) o null = mes completo
    let daySortByShift = false;
    const DAY_VIEW_ORDER = ["MD","M","T1","T","T/P","INT/P","N/P","N","NC"];

    // Todos los códigos de turno asignables desde el abanico (además de "vacío")
    let ALL_SHIFT_CODES = DEFAULT_SHIFT_CODES.slice();

    const CODES = ["M","T1","T","MD","F","N","NC","LAO","POK"];

    const PALETTE = [
      "#92D050","#00B050","#70AD47","#C6EFCE",
      "#FFC000","#FFD966","#F79646","#ED7D31",
      "#00B0F0","#5B9BD5","#9DC3E6","#0070C0","#BDD7EE",
      "#FF0000","#FF6B6B","#C00000","#FFC7CE",
      "#A5A5A5","#D9D9D9","#7F7F7F","#F2F2F2",
      "#C8C0D8","#B4A7D6","#E2D5F1","#7030A0",
      "#002060","#FFFF00","#00FFFF","#FFFFFF"
    ];

    const colorMap = {
      "M": "#FFC000",
      "T1": "#D9D9D9",
      "T": "#FFFFFF",
      "MD": "#F79646",
      "F": "#FF6B6B",
      "N": "#9DC3E6",
      "NC": "#0070C0",
      "LAO": "#047857",
      "INT/P": "#7030A0",
      "T/P": "#7030A0",
      "N/P": "#7030A0",
      "POK": "#7030A0",
      "10A": "#374151",
      "10J": "#374151",
      "C/A": "#374151",
      "LIC": "#F8BBD0"
    };

    // Codes the user requested, in exact order (display labels)
    const SUMMARY_CODES = ["MD", "M", "T1", "T", "N", "NC", "F", "POK"];

    // Possible aliases from the original data → summary code
    const CODE_ALIASES = {
      "MD": "MD",
      "M": "M",
      "T1": "T1",
      "T": "T",
      "N": "N",
      "NC": "NC",
      "F": "F",
      // INT/P, T/P, N/P → all count as POK
      "INT/P": "POK",
      "T/P": "POK",
      "N/P": "POK",
      "POK": "POK"
    };


    function getTextColor(bg) {
      if (!bg || ["#FFFFFF","#F2F2F2","#C6EFCE","#FFC7CE","#BDD7EE","#E2D5F1","#FFD966"].includes(bg)) return "#1a1a1a";
      const hex = bg.replace("#","");
      const r = parseInt(hex.substr(0,2),16);
      const g = parseInt(hex.substr(2,2),16);
      const b = parseInt(hex.substr(4,2),16);
      const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
      return lum > 0.55 ? "#1a1a1a" : "#ffffff";
    }

    function applyColors() {
      document.querySelectorAll("[data-code]").forEach(el => {
        const code = el.dataset.code;
        if (!code) return;
        // POK inherits T/P color if not explicitly set
        let bg = colorMap[code];
        if (!bg && code === "POK") bg = colorMap["T/P"] || colorMap["INT/P"] || colorMap["N/P"];
        if (bg) {
          el.style.background = bg;
          const hideText = code === "LIC" && !el.classList.contains("shift-option");
          el.style.color = hideText ? bg : getTextColor(bg);
        } else {
          el.style.background = "";
          el.style.color = "";
        }
      });
      document.querySelectorAll(".legend-item").forEach(item => {
        const code = item.dataset.code;
        const sw = item.querySelector(".swatch");
        if (colorMap[code]) {
          sw.style.background = colorMap[code];
        } else {
          sw.style.background = "#e2e8f0";
        }
      });
    }

    function saveMap() {
      localStorage.setItem("ctColorMap", JSON.stringify(colorMap));
    }

    // Según el modo de vista actual, de dónde sacar los códigos de una persona
    function codesFor(pi) {
      if (viewMode === "inicial") return INITIAL_CODES[pi] || [];
      if (viewMode === "oficial") return ORIGINAL_CODES[pi] || [];
      return people[pi].codes;
    }

    function cellWasEdited(pi, fromDi, toDi) {
      if (viewMode !== "actual") return false;
      const end = toDi == null ? fromDi : toDi;
      for (let d = fromDi; d <= end; d++) {
        const cur = (people[pi].codes[d] || "");
        const orig = (ORIGINAL_CODES[pi][d] || "");
        if (cur !== orig) return true;
      }
      return false;
    }

    // Códigos que se fusionan en un solo bloque cuando aparecen varios días seguidos
    const BLOCK_CODES = ["LAO", "10A", "10J", "C/A", "LIC"];

    function buildRow(person, pi) {
      const tr = document.createElement("tr");
      tr.dataset.pi = String(pi);
      tr.innerHTML = `
        <td class="sticky-col person-id" data-pi="${pi}">${person.id}</td>
        <td class="sticky-col-2 person-name" data-pi="${pi}">${person.name}</td>
      `;
      const codesArr = codesFor(pi);
      const onlyDay = selectedDay !== null;
      let di = 0;
      while (di < codesArr.length) {
        if (onlyDay && di !== selectedDay) { di++; continue; }
        const code = codesArr[di];
        const upperCode = code ? code.toUpperCase() : "";
        const isBlock = code && BLOCK_CODES.includes(upperCode);
        const td = document.createElement("td");
        td.dataset.pi = String(pi);
        td.dataset.di = String(di);

        if (isBlock && !onlyDay) {
          let runEnd = di;
          while (
            runEnd + 1 < codesArr.length &&
            codesArr[runEnd + 1] &&
            codesArr[runEnd + 1].toUpperCase() === upperCode
          ) {
            runEnd++;
          }
          const runLen = runEnd - di + 1;
          td.dataset.code = upperCode;
          td.textContent = upperCode;
          td.className = "lao-block";
          if (runLen > 1) td.colSpan = runLen;
          if (WEEK_START_DAYS.includes(di)) td.classList.add("week-sep");
          td.style.cursor = viewMode !== "actual" ? "default" : "pointer";
          if (cellWasEdited(pi, di, runEnd)) td.classList.add("edited");
          tr.appendChild(td);
          di = runEnd + 1;
          continue;
        }

        if (!code) {
          td.className = "empty";
          td.textContent = "·";
        } else {
          td.dataset.code = code;
          td.textContent = code;
        }
        if (WEEK_START_DAYS.includes(di)) td.classList.add("week-sep");
        td.style.cursor = viewMode !== "actual" ? "default" : "pointer";
        if (cellWasEdited(pi, di)) td.classList.add("edited");
        tr.appendChild(td);
        di++;
      }
      return tr;
    }

    const GROUP_SPLIT = 12; // Grupo 1: primeros 12 · Grupo 2: resto
    const g1 = document.getElementById("group1");
    const g2 = document.getElementById("group2");
    const daySplit = document.getElementById("daySplit");
    const scheduleTable = document.getElementById("scheduleTable");
    const dayBody1 = document.getElementById("dayBody1");
    const dayBody2 = document.getElementById("dayBody2");
    const dayHead1 = document.getElementById("dayHead1");
    const dayHead2 = document.getElementById("dayHead2");

    function groupTitleRow(text, count, cols) {
      const tr = document.createElement("tr");
      tr.className = "group-split";
      const td = document.createElement("td");
      td.colSpan = cols;
      td.textContent = text + " · " + count + " jefes";
      tr.appendChild(td);
      return tr;
    }

    function fillDayHead(el, title) {
      const wknd = WEEKEND_DAYS.includes(selectedDay) ? " weekend" : "";
      const parts = DAY_LABELS[selectedDay].split(" ");
      el.innerHTML = `<tr>
        <th class="sticky-col">Leg.</th>
        <th class="sticky-col-2">${title}</th>
        <th class="day-only${wknd}">${parts[0]}<br><span class="day-num">${parts[1]}</span></th>
      </tr>`;
    }

    function applyDayHeaderFilter() {
      const bar = document.getElementById("dayFilterBar");
      document.body.classList.toggle("day-view", selectedDay !== null);
      document.body.classList.toggle("month-view", selectedDay === null);
      if (selectedDay === null) {
        if (dayHead1) dayHead1.innerHTML = "";
        if (dayHead2) dayHead2.innerHTML = "";
        if (dayBody1) dayBody1.innerHTML = "";
        if (dayBody2) dayBody2.innerHTML = "";
        if (bar) bar.style.display = "none";
      } else if (bar) {
        bar.style.display = "block";
        const lab = document.getElementById("dayFilterLabel");
        if (lab) lab.textContent = "Sólo " + DAY_LABELS[selectedDay];
        const sortBtn = document.getElementById("btnDaySort");
        if (sortBtn) sortBtn.textContent = daySortByShift ? "Orden lista" : "Por turno";
      }
    }

    function renderGroups() {
      if (selectedDay === null) {
        g1.innerHTML = "";
        g2.innerHTML = "";
        g1.appendChild(groupTitleRow("Grupo 1", GROUP_SPLIT, DAYS + 2));
        g2.appendChild(groupTitleRow("Grupo 2", people.length - GROUP_SPLIT, DAYS + 2));
        people.forEach((p, pi) => {
          const row = buildRow(p, pi);
          if (pi < GROUP_SPLIT) g1.appendChild(row);
          else g2.appendChild(row);
        });
      } else {
        dayBody1.innerHTML = "";
        dayBody2.innerHTML = "";
        if (!daySortByShift) {
          fillDayHead(dayHead1, "Grupo 1");
          fillDayHead(dayHead2, "Grupo 2");
          people.forEach((p, pi) => {
            const row = buildRow(p, pi);
            if (pi < GROUP_SPLIT) dayBody1.appendChild(row);
            else dayBody2.appendChild(row);
          });
        } else {
          const ranked = [];
          people.forEach((p, pi) => {
            const codesArr = codesFor(pi);
            const code = codesArr[selectedDay] || "";
            const order = DAY_VIEW_ORDER.indexOf(code);
            if (order === -1) return;
            ranked.push({ pi, order });
          });
          ranked.sort((a, b) => a.order - b.order || a.pi - b.pi);
          const mid = Math.ceil(ranked.length / 2);
          fillDayHead(dayHead1, "Por turno");
          fillDayHead(dayHead2, "Por turno");
          ranked.forEach((item, i) => {
            const row = buildRow(people[item.pi], item.pi);
            if (i < mid) dayBody1.appendChild(row);
            else dayBody2.appendChild(row);
          });
        }
      }
      applyDayHeaderFilter();
    }
    function normCode(c) {
      if (c == null || c === "") return "";
      return String(c).trim().toUpperCase();
    }
    function normalizePeople(list) {
      return list.map(p => ({
        id: String(p.id || ""),
        name: p.name,
        codes: (Array.isArray(p.codes) ? p.codes.slice() : String(p.codes || "").split(/\s+/)).map(normCode)
      })).map(p => {
        while (p.codes.length < DAYS) p.codes.push("");
        p.codes = p.codes.slice(0, DAYS);
        return p;
      });
    }
    function applyCatalog(data) {
      if (!data || typeof data !== "object") return;
      if (Array.isArray(data.codigos) && data.codigos.length) {
        ALL_SHIFT_CODES = data.codigos.map(normCode).filter(Boolean);
      }
      if (data.colores && typeof data.colores === "object") {
        Object.keys(data.colores).forEach(k => {
          colorMap[normCode(k)] = data.colores[k];
        });
      }
    }

    // Trae el JSON de un mes (null si no existe o falla)
    async function fetchMes(key) {
      try {
        const r = await fetch(mesInfo(key).file + "?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return null;
        const data = await r.json();
        if (data && Array.isArray(data.people) && data.people.length) return data;
      } catch (e) {}
      return null;
    }

    // Arma el encabezado de días según el mes (cantidad de días y día de la semana del 1)
    function renderDayHead() {
      const row = document.getElementById("dayHeadRow");
      row.innerHTML = '<th class="sticky-col">Legajo</th><th class="sticky-col-2">Apellido</th>';
      for (let d = 0; d < DAYS; d++) {
        const wd = (MES.startWd + d) % 7;
        const th = document.createElement("th");
        th.dataset.di = String(d);
        const cls = [];
        if (wd >= 5) cls.push("weekend");
        if (wd === 0 && d > 0) cls.push("week-sep");
        th.className = cls.join(" ");
        th.innerHTML = WEEKDAY_ABBR[wd] + '<br><span class="day-num">' + (d + 1) + "</span>";
        row.appendChild(th);
      }
    }

    // Deja todo listo para mostrar un mes: fechas, título, encabezado y ediciones locales
    function setMonthGlobals(key) {
      currentMes = key;
      MES = mesInfo(key);
      DAYS = MES.days;
      DAY_LABELS = [];
      WEEKEND_DAYS = [];
      WEEK_START_DAYS = [];
      for (let d = 0; d < DAYS; d++) {
        const wd = (MES.startWd + d) % 7;
        DAY_LABELS.push(WEEKDAY_ABBR[wd] + " " + (d + 1));
        if (wd >= 5) WEEKEND_DAYS.push(d);
        if (wd === 0 && d > 0) WEEK_START_DAYS.push(d);
      }
      document.documentElement.style.setProperty("--days-total", (DAYS * 42) + "px");
      document.getElementById("titleFull").textContent = "PROGRAMACIÓN JEFES — " + MES.nombre + " " + MES.y;
      document.getElementById("titleShort").textContent = MES.m + "/" + String(MES.y).slice(2);
      document.title = "Jefes " + MES_ABR[MES.m - 1] + " " + MES.y;
      selectedDay = null;
      daySortByShift = false;
      loadEdits();
      renderDayHead();
    }

    // Muestra un mes: usa el JSON publicado si existe, si no la semilla incluida en el HTML
    function switchMonth(key) {
      setMonthGlobals(key);
      const data = MES_DATA[key];
      ALL_SHIFT_CODES = DEFAULT_SHIFT_CODES.slice();
      if (data) {
        applyCatalog(data);
        people = normalizePeople(data.people);
      } else {
        people = normalizePeople(SEED_BY_MES[key]);
      }
      ORIGINAL_CODES = people.map(p => p.codes.slice());
      if (SEED_BY_MES[key]) {
        INITIAL_CODES = normalizePeople(SEED_BY_MES[key]).map(p => p.codes.slice());
      } else {
        // Mes sin semilla: la primera versión publicada que vio este dispositivo queda como "inicial"
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem("ctInitial:" + key) || "null"); } catch (e) {}
        if (!Array.isArray(saved)) {
          saved = ORIGINAL_CODES.map(c => c.slice());
          try { localStorage.setItem("ctInitial:" + key, JSON.stringify(saved)); } catch (e) {}
        }
        INITIAL_CODES = saved;
      }
      resetPeopleFromOfficial();
      renderGroups();
      buildShiftGrid();
      applyColors();
    }

    // Vuelve a traer el JSON del mes que se está viendo (auto-actualización)
    async function loadSharedSchedule() {
      const mes = currentMes;
      const data = await fetchMes(mes);
      if (mes !== currentMes) return; // cambiaron de mes mientras cargaba
      if (data) {
        MES_DATA[mes] = data;
        applyCatalog(data);
        people = normalizePeople(data.people);
        ORIGINAL_CODES = people.map(p => p.codes.slice());
      }
      resetPeopleFromOfficial();
      renderGroups();
      buildShiftGrid();
      applyColors();
    }

    // ---- Meses disponibles ----
    const MES_DATA = {};        // JSON publicado ya traído, por mes
    let AVAILABLE_MESES = [];

    function mesKeyOf(y, m) { return y + "-" + String(m).padStart(2, "0"); }
    // Meses a probar: desde 5 meses atrás (sin bajar de septiembre 2026) hasta 2 meses adelante
    function candidateMeses() {
      const now = new Date();
      const nowIdx = now.getFullYear() * 12 + now.getMonth();
      const [fy, fm] = FIRST_MES.split("-").map(Number);
      const start = Math.max(fy * 12 + fm - 1, nowIdx - 5);
      const end = Math.max(nowIdx + 2, 2026 * 12 + 9); // como mínimo hasta octubre 2026
      const out = [];
      for (let i = start; i <= end; i++) out.push(mesKeyOf(Math.floor(i / 12), (i % 12) + 1));
      return out;
    }

    function fillMonthSelect() {
      const sel = document.getElementById("monthSelect");
      sel.innerHTML = "";
      AVAILABLE_MESES.forEach(k => {
        const mi = mesInfo(k);
        const o = document.createElement("option");
        o.value = k;
        o.textContent = MES_ABR[mi.m - 1] + " " + mi.y;
        sel.appendChild(o);
      });
      sel.style.display = AVAILABLE_MESES.length > 1 ? "" : "none";
      sel.value = currentMes;
    }
    document.getElementById("monthSelect").addEventListener("change", (e) => {
      const key = e.target.value;
      try { sessionStorage.setItem("jefesMes", key); } catch (err) {}
      switchMonth(key);
    });

    async function initApp() {
      const cands = candidateMeses();
      const results = await Promise.all(cands.map(k => fetchMes(k)));
      cands.forEach((k, i) => { if (results[i]) MES_DATA[k] = results[i]; });
      AVAILABLE_MESES = cands.filter(k => MES_DATA[k] || SEED_BY_MES[k]);
      if (!AVAILABLE_MESES.length) AVAILABLE_MESES = [FIRST_MES];
      let want = null;
      try { want = sessionStorage.getItem("jefesMes"); } catch (e) {}
      if (!want || !AVAILABLE_MESES.includes(want)) {
        const now = new Date();
        const today = mesKeyOf(now.getFullYear(), now.getMonth() + 1);
        want = AVAILABLE_MESES.includes(today) ? today : AVAILABLE_MESES[AVAILABLE_MESES.length - 1];
      }
      switchMonth(want);
      fillMonthSelect();
    }
    initApp();

    // Auto-actualización: cada cierto tiempo vuelve a traer el JSON del mes que se está viendo,
    // así los dispositivos que ya tienen la página abierta reciben los cambios solos.
    const AUTO_REFRESH_MS = 3 * 60 * 1000; // cada 3 minutos
    setInterval(() => {
      const openOverlay = document.querySelector(".palette-overlay.open, #loginOverlay.open");
      if (openOverlay) return; // no interrumpir si hay un modal abierto (editando un turno, login, etc.)
      loadSharedSchedule();
    }, AUTO_REFRESH_MS);

    // Además de traer el JSON, cada cierto tiempo recarga la página entera saltando
    // la caché del celular. Esto asegura que si el propio HTML/código cambió (no solo
    // los datos), el celular lo termine tomando solo sin que haya que reinstalarla.
    const FULL_RELOAD_MS = 20 * 60 * 1000; // cada 20 minutos
    setInterval(() => {
      const openOverlay = document.querySelector(".palette-overlay.open, #loginOverlay.open");
      if (openOverlay) return;
      location.replace(location.pathname + "?v=" + Date.now());
    }, FULL_RELOAD_MS);

    let currentUser = sessionStorage.getItem("jefesUser") || "";
    function setAdminUI() {
      document.body.classList.toggle("is-admin", currentUser === "ADMIN");
      document.getElementById("btnUser").title = currentUser === "ADMIN" ? "Admin (salir)" : "Usuario";
    }
    setAdminUI();
    const loginOverlay = document.getElementById("loginOverlay");
    document.getElementById("btnUser").addEventListener("click", () => {
      if (currentUser === "ADMIN") {
        if (confirm("¿Cerrar sesión de admin?")) {
          currentUser = "";
          sessionStorage.removeItem("jefesUser");
          if (viewMode === "inicial") {
            viewMode = "actual";
            btnOriginalView.textContent = "A";
            btnOriginalView.title = "Actual (editable)";
            btnOriginalView.style.background = "#7c3aed";
            refreshAfterEdit();
          }
          setAdminUI();
        }
        return;
      }
      document.getElementById("loginErr").textContent = "";
      document.getElementById("loginPass").value = "";
      loginOverlay.classList.add("open");
      document.getElementById("loginPass").focus();
    });
    document.getElementById("loginCancel").addEventListener("click", () => loginOverlay.classList.remove("open"));
    loginOverlay.addEventListener("click", (e) => {
      if (e.target === loginOverlay) loginOverlay.classList.remove("open");
    });
    document.getElementById("loginGo").addEventListener("click", () => {
      const pw = document.getElementById("loginPass").value;
      if (pw === "1318") {
        currentUser = "ADMIN";
        sessionStorage.setItem("jefesUser", "ADMIN");
        setAdminUI();
        loginOverlay.classList.remove("open");
      } else {
        document.getElementById("loginErr").textContent = "Clave incorrecta";
      }
    });
    document.getElementById("loginPass").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("loginGo").click();
    });

    function currentJson() {
      return {
        mes: currentMes,
        codigos: ALL_SHIFT_CODES.slice(),
        colores: Object.assign({}, colorMap),
        people: people.map(p => ({ id: p.id, name: p.name, codes: p.codes.slice() }))
      };
    }
    document.getElementById("btnExportJson").addEventListener("click", async () => {
      const jsonText = JSON.stringify(currentJson(), null, 2);
      const blob = new Blob([jsonText], { type: "application/json" });

      // En el celular, "compartir" es más confiable que la descarga (Safari suele
      // abrir el JSON como texto en vez de guardarlo con el attribute "download").
      let file = null;
      try { file = new File([blob], MES.file, { type: "application/json" }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: MES.file });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return; // el usuario canceló el panel de compartir
        }
      }

      // Escritorio / navegadores sin Web Share: descarga normal
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = MES.file;
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById("btnCopyJson").addEventListener("click", async () => {
      const jsonText = JSON.stringify(currentJson(), null, 2);
      const btn = document.getElementById("btnCopyJson");
      const marcarCopiado = () => {
        const prev = btn.textContent;
        btn.textContent = "✓ Copiado";
        setTimeout(() => { btn.textContent = prev; }, 1500);
      };
      try {
        await navigator.clipboard.writeText(jsonText);
        marcarCopiado();
      } catch (err) {
        // Fallback para navegadores que no permiten el portapapeles moderno
        const ta = document.createElement("textarea");
        ta.value = jsonText;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand("copy"); marcarCopiado(); } catch (e2) {
          alert("No se pudo copiar automáticamente. Mantené presionado el botón ↓ JSON y usá \"Compartir\".");
        }
        document.body.removeChild(ta);
      }
    });
    document.getElementById("btnImportJson").addEventListener("click", () => {
      document.getElementById("importJsonFile").click();
    });
    document.getElementById("importJsonFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const list = Array.isArray(data) ? data : data.people;
          if (!list || !list.length) throw new Error("sin people");
          if (data.mes && data.mes !== currentMes &&
              !confirm("Este JSON es de " + data.mes + " pero estás viendo " + currentMes + ". ¿Importarlo igual?")) return;
          applyCatalog(data);
          people = normalizePeople(list);
          ORIGINAL_CODES = people.map(p => p.codes.slice());
          editsMap = {};
          try { localStorage.removeItem(editsKey(currentMes)); } catch (err) {}
          renderGroups();
          applyColors();
          alert("JSON importado. Para que lo vean todos, subí ese mismo archivo a GitHub como " + MES.file);
        } catch (err) {
          alert("JSON inválido");
        }
      };
      reader.readAsText(file);
    });
    // ========== ABANICO DE TURNOS (reasignar el CT de una celda) ==========
    let shiftPersonIdx = null;
    let shiftDayIdx = null;
    const shiftOverlay = document.getElementById("shiftOverlay");
    const shiftGrid = document.getElementById("shiftGrid");
    const shiftPersonDay = document.getElementById("shiftPersonDay");

    function buildShiftGrid() {
      shiftGrid.innerHTML = "";
      ALL_SHIFT_CODES.forEach(code => {
        const opt = document.createElement("div");
        opt.className = "shift-option";
        opt.dataset.code = code;
        opt.textContent = code;
        let bg = colorMap[code];
        if (!bg && code === "POK") bg = colorMap["T/P"] || colorMap["INT/P"] || colorMap["N/P"];
        if (bg) {
          opt.style.background = bg;
          opt.style.color = getTextColor(bg);
        }
        opt.addEventListener("click", () => applyShift(code));
        shiftGrid.appendChild(opt);
      });
    }
    buildShiftGrid();

    function openShiftPicker(pi, di) {
      if (viewMode !== "actual") return;
      shiftPersonIdx = pi;
      shiftDayIdx = di;
      const person = people[pi];
      shiftPersonDay.textContent = `${person.name} · día ${di + 1}`;
      document.querySelectorAll(".shift-option").forEach(el => {
        el.classList.toggle("selected", el.dataset.code === person.codes[di]);
      });
      shiftOverlay.classList.add("open");
    }

    function saveEdit(pi, di, code) {
      editsMap[pi + ":" + di] = code;
      try { localStorage.setItem(editsKey(currentMes), JSON.stringify(editsMap)); } catch (e) {}
    }
    function removeEdit(pi, di) {
      delete editsMap[pi + ":" + di];
      try { localStorage.setItem(editsKey(currentMes), JSON.stringify(editsMap)); } catch (e) {}
    }

    function refreshAfterEdit() {
      renderGroups();
      buildShiftGrid();
      applyColors();
      if (personOverlay.classList.contains("open") && shiftPersonIdx !== null) {
        openPersonCalendar(shiftPersonIdx);
      }
    }

    function applyShift(code) {
      people[shiftPersonIdx].codes[shiftDayIdx] = code;
      saveEdit(shiftPersonIdx, shiftDayIdx, code);
      refreshAfterEdit();
      closeShiftPicker();
    }

    document.getElementById("clearShift").addEventListener("click", () => {
      people[shiftPersonIdx].codes[shiftDayIdx] = "";
      saveEdit(shiftPersonIdx, shiftDayIdx, "");
      refreshAfterEdit();
      closeShiftPicker();
    });

    document.getElementById("restoreShift").addEventListener("click", () => {
      const original = ORIGINAL_CODES[shiftPersonIdx][shiftDayIdx];
      people[shiftPersonIdx].codes[shiftDayIdx] = original;
      removeEdit(shiftPersonIdx, shiftDayIdx);
      refreshAfterEdit();
      closeShiftPicker();
    });

    document.getElementById("closeShift").addEventListener("click", closeShiftPicker);
    document.getElementById("doneShift").addEventListener("click", closeShiftPicker);
    shiftOverlay.addEventListener("click", (e) => {
      if (e.target === shiftOverlay) closeShiftPicker();
    });

    function closeShiftPicker() {
      shiftOverlay.classList.remove("open");
    }

    document.addEventListener("click", (e) => {
      if (viewMode !== "actual") return;
      if (e.target.closest("#shiftOverlay")) return;
      if (e.target.closest("thead")) return;
      const td = e.target.closest("td[data-pi][data-di]");
      if (!td) return;
      openShiftPicker(Number(td.dataset.pi), Number(td.dataset.di));
    });

    function toggleDayFilter(di) {
      if (selectedDay === di) {
        selectedDay = null;
        daySortByShift = false;
      } else {
        selectedDay = di;
        daySortByShift = false;
      }
      refreshAfterEdit();
    }
    document.getElementById("btnDaySort").addEventListener("click", () => {
      daySortByShift = !daySortByShift;
      refreshAfterEdit();
    });
    document.getElementById("dayHeadRow").addEventListener("click", (e) => {
      const th = e.target.closest("th[data-di]");
      if (!th) return;
      e.preventDefault();
      toggleDayFilter(Number(th.dataset.di));
    });
    document.getElementById("btnClearDay").addEventListener("click", () => {
      selectedDay = null;
      daySortByShift = false;
      refreshAfterEdit();
    });

    // ========== VER PROGRAMACIÓN ACTUAL / OFICIAL / INICIAL ==========
    // Un solo botón cicla entre los 3 modos, para no ocupar más lugar en la barra:
    //   A = Actual (editable)
    //   O = Oficial (la última que se publicó en GitHub, solo lectura)
    //   I = Inicial (la programación de arranque del mes, solo lectura)
    const VIEW_MODE_ORDER = ["actual", "oficial", "inicial"];
    const VIEW_MODE_LABEL = { actual: "A", oficial: "O", inicial: "I" };
    const VIEW_MODE_TITLE = {
      actual: "Actual (editable)",
      oficial: "Oficial (última publicada)",
      inicial: "Programación inicial del mes"
    };
    const VIEW_MODE_COLOR = { actual: "#7c3aed", oficial: "#5b21b6", inicial: "#0f766e" };
    const btnOriginalView = document.getElementById("btnOriginalView");
    btnOriginalView.addEventListener("click", () => {
      const order = currentUser === "ADMIN" ? VIEW_MODE_ORDER : ["actual", "oficial"];
      const next = order[(order.indexOf(viewMode) + 1) % order.length];
      viewMode = next;
      btnOriginalView.textContent = VIEW_MODE_LABEL[next];
      btnOriginalView.title = VIEW_MODE_TITLE[next];
      btnOriginalView.style.background = VIEW_MODE_COLOR[next];
      refreshAfterEdit();
    });

    // Toggle: ocultar apellido, dejar solo legajo
    const btnToggleNames = document.getElementById("btnToggleNames");
    let namesHidden = false;
    try { namesHidden = localStorage.getItem("jefesHideNames") === "1"; } catch (e) {}
    function applyNamesHidden() {
      document.body.classList.toggle("names-hidden", namesHidden);
      if (btnToggleNames) {
        btnToggleNames.textContent = namesHidden ? "L" : "N";
        btnToggleNames.title = namesHidden ? "Mostrar nombres" : "Ocultar nombres";
        btnToggleNames.classList.toggle("on", namesHidden);
      }
    }
    applyNamesHidden();
    if (btnToggleNames) {
      btnToggleNames.addEventListener("click", () => {
        namesHidden = !namesHidden;
        try { localStorage.setItem("jefesHideNames", namesHidden ? "1" : "0"); } catch (e) {}
        applyNamesHidden();
      });
    }

    const personOverlay = document.getElementById("personOverlay");
    const personCalTitle = document.getElementById("personCalTitle");
    const personCalGrid = document.getElementById("personCalGrid");
    const personCalRow = document.getElementById("personCalRow");
    const btnToggleCalView = document.getElementById("btnToggleCalView");

    let calViewMode = "grid"; // "grid" (almanaque) u "horizontal" (fila única)
    try { calViewMode = localStorage.getItem("jefesCalView") || "grid"; } catch (e) {}

    let currentCalPi = null;

    function applyCalViewMode() {
      const isRow = calViewMode === "horizontal";
      personCalGrid.style.display = isRow ? "none" : "grid";
      personCalRow.classList.toggle("open", isRow);
      document.querySelector(".person-cal-modal").classList.toggle("wide", isRow);
      btnToggleCalView.textContent = isRow ? "▦" : "↔";
      btnToggleCalView.title = isRow ? "Ver como almanaque" : "Ver horizontal";
    }

    function openPersonCalendar(pi) {
      currentCalPi = pi;
      const person = people[pi];
      const codesArr = codesFor(pi);
      personCalTitle.textContent = person.name + " · " + person.id;

      // Vista almanaque (grilla de 7 columnas)
      let gridHtml = WEEKDAY_ABBR.map(d => `<div class="cal-wd">${d}</div>`).join("");
      for (let i = 0; i < MES.startWd; i++) gridHtml += `<div class="cal-empty"></div>`;
      for (let d = 0; d < DAYS; d++) {
        const code = codesArr[d] || "";
        const bg = code ? (colorMap[code] || "#e2e8f0") : "#f8fafc";
        const fg = code ? getTextColor(bg) : "#94a3b8";
        const edited = viewMode === "actual" && (codesArr[d] || "") !== (ORIGINAL_CODES[pi][d] || "");
        gridHtml += `<div class="cal-day${edited ? " edited" : ""}" data-pi="${pi}" data-di="${d}" style="background:${bg};color:${fg}">
          <span class="cal-num">${d + 1}</span>
          <span class="cal-code">${code || "·"}</span>
        </div>`;
      }
      personCalGrid.innerHTML = gridHtml;

      // Vista horizontal (una fila con todos los días, para leer el mes de corrido)
      let rowHtml = "";
      for (let d = 0; d < DAYS; d++) {
        const code = codesArr[d] || "";
        const bg = code ? (colorMap[code] || "#e2e8f0") : "#f8fafc";
        const fg = code ? getTextColor(bg) : "#94a3b8";
        const edited = viewMode === "actual" && (codesArr[d] || "") !== (ORIGINAL_CODES[pi][d] || "");
        const wd = WEEKDAY_ABBR[(MES.startWd + d) % 7];
        rowHtml += `<div class="cal-day-h${edited ? " edited" : ""}" data-pi="${pi}" data-di="${d}" style="background:${bg};color:${fg}">
          <span class="cal-wd-h">${wd}</span>
          <span class="cal-num-h">${d + 1}</span>
          <span class="cal-code-h">${code || "·"}</span>
        </div>`;
      }
      personCalRow.innerHTML = rowHtml;

      applyCalViewMode();
      personOverlay.classList.add("open");
    }
    function closePersonCalendar() {
      personOverlay.classList.remove("open");
    }
    btnToggleCalView.addEventListener("click", () => {
      calViewMode = calViewMode === "horizontal" ? "grid" : "horizontal";
      try { localStorage.setItem("jefesCalView", calViewMode); } catch (e) {}
      applyCalViewMode();
    });
    document.getElementById("closePersonCal").addEventListener("click", closePersonCalendar);
    personOverlay.addEventListener("click", (e) => {
      if (e.target === personOverlay) closePersonCalendar();
    });
    personCalGrid.addEventListener("click", (e) => {
      const cell = e.target.closest(".cal-day[data-di]");
      if (!cell || viewMode !== "actual") return;
      openShiftPicker(Number(cell.dataset.pi), Number(cell.dataset.di));
    });
    personCalRow.addEventListener("click", (e) => {
      const cell = e.target.closest(".cal-day-h[data-di]");
      if (!cell || viewMode !== "actual") return;
      openShiftPicker(Number(cell.dataset.pi), Number(cell.dataset.di));
    });

    document.addEventListener("click", (e) => {
      const cell = e.target.closest("td.person-name, td.person-id");
      if (!cell) return;
      openPersonCalendar(Number(cell.dataset.pi));
    });
</script>
</body>
</html>
