<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Jefes</title>
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jefes">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d0d7de;
      --header-bg: #1e3a5f;
      --name-col: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: #1f2937;
      line-height: 1.4;
      padding: 16px 8px 60px;
    }
    .container {
      max-width: none;
      margin: 0 auto;
      padding: 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; margin-bottom: 8px; width: 100%; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #1e3a5f; }
    header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }
    .title-short { display: none; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .view-original-btn {
      margin-top: 0;
      border: 0;
      border-radius: 7px;
      padding: 7px 12px;
      background: #7c3aed;
      color: white;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
    }
    footer { display: none !important; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 10px 0 4px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px 3px 4px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #334155;
    }
    .legend-item .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .group {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      margin: 0 auto 24px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 100%;
    }
    .group-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
      color: white;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .group-header span {
      background: rgba(255,255,255,0.18);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 0;
      font-size: 0.75rem;
    }
    thead th {
      background: var(--header-bg);
      color: #fff;
      font-weight: 600;
      padding: 8px 3px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 45;
      border-bottom: 2px solid #0f2744;
      white-space: nowrap;
      height: 52px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    /* Encabezados de día (fecha/número) en gris medio, con el finde suavizado */
    thead th:not(.sticky-col):not(.sticky-col-2) {
      background: #64748b;
      border-bottom: 2px solid #475569;
    }
    thead th.day-num { font-size: 0.85rem; font-weight: 500; }
    thead th.weekend { background: #94a3b8; }
    th.sticky-col, td.sticky-col {
      position: sticky; left: 0; z-index: 10; background: var(--name-col);
    }
    th.sticky-col-2, td.sticky-col-2 {
      position: sticky; left: 68px; z-index: 10; background: var(--name-col);
      border-right: 2px solid var(--border);
    }
    th.sticky-col, td.sticky-col {
      left: 0;
      z-index: 25;
    }
    th.sticky-col {
      background: var(--header-bg);
    }
    th.sticky-col-2, td.sticky-col-2 {
      left: var(--col-legajo);
      z-index: 25;
    }
    th.sticky-col-2 {
      background: var(--header-bg); text-align: left; padding-left: 8px;
    }
    tbody td {
      text-align: center;
      padding: 6px 3px;
      border: 1px solid #e5e7eb;
      font-weight: 600;
      font-size: 1.05rem;
      min-width: 48px;
      height: 39px;
      box-sizing: border-box;
      cursor: pointer;
      transition: filter 0.1s;
    }
    tbody td:hover { filter: brightness(0.93); }
    tbody tr:nth-child(even) td.sticky-col,
    tbody tr:nth-child(even) td.sticky-col-2 { background: #f1f5f9; }
    td.sticky-col {
      font-weight: 600; color: #475569; font-size: 0.72rem; border-right: none;
    }
    td.sticky-col-2 {
      text-align: left; padding-left: 8px; font-weight: 600;
      color: #1e293b; font-size: 0.78rem; white-space: nowrap;
    }
    td.empty { background: #fafafa; color: #cbd5e1; cursor: default; }
    td.empty:hover { filter: none; }

    [data-code] {
      background: #f1f5f9;
      color: #334155;
    }

    .palette-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .palette-overlay.open { display: flex !important; }
    #shiftOverlay { z-index: 1100; }
    .palette-modal {
      background: white;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      padding: 18px;
    }
    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .palette-header h3 {
      font-size: 1rem;
      color: #1e293b;
    }
    .palette-header .code-badge {
      background: #1e3a5f;
      color: white;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      color: #64748b;
      line-height: 1;
    }
    .close-btn:hover { background: #e2e8f0; color: #1e293b; }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .shift-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .shift-option {
      padding: 12px 4px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: center;
      background: #f1f5f9;
      color: #334155;
      transition: transform 0.12s, border-color 0.12s;
      user-select: none;
    }
    .shift-option:hover { transform: scale(1.05); border-color: #1e293b; }
    .shift-option.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.4);
    }
    #originalBanner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #78350f;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
      width: 100%;
    }
    .palette-color {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      position: relative;
    }
    .palette-color:hover {
      transform: scale(1.08);
      border-color: #1e293b;
    }
    .palette-color.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.4);
    }
    .palette-color .hex-label {
      position: absolute;
      bottom: 2px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.55rem;
      font-weight: 600;
      color: rgba(0,0,0,0.55);
      text-shadow: 0 0 3px white;
      pointer-events: none;
    }
    .palette-actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }
    #shiftOverlay .palette-modal {
      max-height: min(90dvh, 90vh);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #shiftOverlay .shift-grid { flex: 0 0 auto; }
    #shiftCommentWrap {
      margin-top: 10px;
      flex: 0 0 auto;
    }
    #shiftCommentWrap label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 4px;
    }
    #shiftComment {
      width: 100%;
      height: 72px;
      min-height: 72px;
      max-height: 72px;
      resize: none;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 16px;
      line-height: 1.3;
      font-family: inherit;
      overflow-y: auto;
    }
    body.shift-open { overflow: hidden; }
    td.has-comment, .cal-day.has-comment, .cal-day-h.has-comment {
      position: relative;
    }
    td.has-comment .comment-dot,
    .cal-day.has-comment .comment-dot {
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 1.5px #fff;
      pointer-events: none;
      z-index: 4;
    }
    .wa-share-btn {
      background: #25D366; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .wa-share-btn:hover { background: #1ebe5a; color: #fff; }
    .wa-share-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .wa-share-btn:disabled { opacity: 0.6; cursor: wait; }
    .cal-day-h.has-comment .comment-dot {
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 1.5px #fff;
      pointer-events: none;
      z-index: 4;
    }
    .color-step {
      font-size: 0.75rem; font-weight: 700; color: #475569;
      margin: 4px 0 6px;
    }
    #colorStep2 { margin-top: 14px; }
    #colorCodeGrid .shift-option { padding: 9px 3px; }
    .custom-color {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding: 6px 10px;
      border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 0.8rem; font-weight: 600; color: #334155; cursor: pointer;
    }
    .custom-color input { width: 44px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
    .color-note { margin-top: 10px; font-size: 0.7rem; color: #64748b; text-align: center; }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-clear {
      background: #f1f5f9;
      color: #475569;
    }
    .btn-clear:hover { background: #e2e8f0; }
    .btn-done {
      background: #1e3a5f;
      color: white;
    }
    .btn-done:hover { background: #16304f; }

    .group-body {
      display: flex;
      gap: 0;
      align-items: stretch;
    }
    .group-body .table-wrap {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
    }
    .group-body .counts-wrap {
      flex: 0 0 auto;
      border-left: 3px solid #1e3a5f;
      overflow: hidden;
    }
    .group-body .counts-wrap table {
      min-width: 0;
      width: auto;
      border-collapse: collapse;
    }
    /* Match EXACTLY the main table cell metrics */
    .group-body .counts-wrap thead th {
      background: #2a4a73;
      color: #fff;
      font-weight: 600;
      font-size: 0.65rem;
      padding: 7px 2px;
      text-align: center;
      border-bottom: 2px solid #0f2744;
      white-space: nowrap;
      min-width: 30px;
      width: 30px;
      line-height: 1.25;
      height: 40px;          /* approx 2-line header height */
      box-sizing: border-box;
    }
    .group-body .counts-wrap tbody td {
      text-align: center;
      padding: 4px 2px;
      border: 1px solid #e5e7eb;
      font-weight: 600;
      font-size: 0.7rem;
      min-width: 30px;
      width: 30px;
      height: 26px;
      box-sizing: border-box;
    }
    /* Force main table body cells to same fixed height */
    .group-body .table-wrap tbody td {
      height: 26px;
      box-sizing: border-box;
    }
    .group-body .table-wrap thead th {
      height: 40px;
      box-sizing: border-box;
    }
    .hint {

      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    footer {
      text-align: center;
      margin-top: 12px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  
    #summaryTable {
      table-layout: auto;
    }
    #summaryTable thead th:not(.sticky-col):not(.sticky-col-2) {
      min-width: 30px;
      width: 30px;
    }
    #summaryTable tbody td:not(.sticky-col):not(.sticky-col-2) {
      min-width: 30px;
      width: 30px;
      height: 26px;
      box-sizing: border-box;
    }

  
    /* ========== STRICT COLUMN ALIGNMENT ========== */
    :root {
      --col-legajo: 68px;
      --col-nombre: 130px;
      --col-day: 42px;
      --days-total: 1260px; /* 30 * 42 */
    }

    table {
      table-layout: fixed;
      border-collapse: collapse;
    }

    /* Sticky columns – same everywhere */
    th.sticky-col, td.sticky-col {
      position: sticky;
      left: 0;
      z-index: 10;
      width: var(--col-legajo) !important;
      min-width: var(--col-legajo) !important;
      max-width: var(--col-legajo) !important;
      box-sizing: border-box;
    }
    th.sticky-col {
      background: var(--header-bg);
      z-index: 25;
    }
    td.sticky-col {
      background: var(--name-col);
    }
    tbody tr:nth-child(even) td.sticky-col {
      background: #f1f5f9;
    }

    th.sticky-col-2, td.sticky-col-2 {
      position: sticky;
      left: var(--col-legajo);
      z-index: 10;
      width: var(--col-nombre) !important;
      min-width: var(--col-nombre) !important;
      max-width: var(--col-nombre) !important;
      box-sizing: border-box;
      border-right: 2px solid var(--border);
    }
    th.sticky-col-2 {
      background: var(--header-bg);
      z-index: 25;
      text-align: left;
      padding-left: 8px;
    }
    td.sticky-col-2 {
      background: var(--name-col);
      text-align: left;
      padding-left: 8px;
    }
    tbody tr:nth-child(even) td.sticky-col-2 {
      background: #f1f5f9;
    }

    /* Separador de semana (entre DO y LU) — nunca corta un bloque LAO, porque ese bloque es una sola celda */
    .week-sep {
      border-left: 3px solid #334155 !important;
    }
    /* Bloque de vacaciones (LAO) fusionado en una sola celda */
    td.lao-block {
      font-size: 0.72rem;
      letter-spacing: 0.03em;
    }

    /* Day columns – identical width everywhere (main + summary) */
    thead th:not(.sticky-col):not(.sticky-col-2),
    tbody td:not(.sticky-col):not(.sticky-col-2) {
      width: var(--col-day) !important;
      min-width: var(--col-day) !important;
      max-width: var(--col-day) !important;
      box-sizing: border-box;
      padding: 6px 2px;
      overflow: hidden;
    }
    thead th:not(.sticky-col):not(.sticky-col-2) {
      padding: 8px 2px;
      height: 52px;
    }
    tbody td:not(.sticky-col):not(.sticky-col-2) {
      height: 39px;
    }

    /* Main schedule tables width = sticky + sticky2 + días del mes (--days-total lo fija el JS) */
    .group-body .table-wrap table {
      width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      min-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      max-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
    }

    /* Summary table same width formula */
    #summaryTable {
      width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
      min-width: calc(var(--col-legajo) + var(--col-nombre) + var(--days-total));
    }

    /* Side counts – fixed narrow columns, do not affect day alignment */
    .group-body {
      display: flex;
      align-items: flex-start;
      gap: 0;
      padding: 0;
    }
    .group-body .table-wrap {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    /* Conteo por jefe: se muestra como tabla independiente, separada de la programación */
    .group-body .counts-wrap {
      flex: 0 0 auto;
      margin-left: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow: hidden;
      background: #fff;
    }
    .group-body .counts-wrap table {
      width: auto;
      table-layout: fixed;
    }
    .group-body .counts-wrap thead th {
      background: #2a4a73;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      width: 42px !important;
      min-width: 42px !important;
      max-width: 42px !important;
      padding: 8px 2px;
      box-sizing: border-box;
      border: 1px solid transparent;
      border-bottom: 2px solid #0f2744;
      line-height: 1.25;
      vertical-align: middle;
    }
    .group-body .counts-wrap tbody td {
      width: 42px !important;
      min-width: 42px !important;
      max-width: 42px !important;
      padding: 6px 2px;
      box-sizing: border-box;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      border: 1px solid #e5e7eb;
      vertical-align: middle;
    }
    .group-body .counts-wrap tbody tr:last-child td { border-bottom: none; }
    .group-body .counts-wrap tbody td:last-child { border-right: none; }

  
    /* Toggle buttons */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e3a5f;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin: 4px 6px 4px 0;
    }
    .toggle-btn:hover { background: #16304f; }
    .toggle-btn .arrow {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 0.75rem;
    }
    .toggle-btn.collapsed .arrow { transform: rotate(-90deg); }
    .toggle-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 14px;
      align-items: center;
    }
    .collapsible.hidden-section { display: none !important; }
    .counts-wrap.hidden-section { display: none !important; }

  
    .gnum {
      display: inline-block;
      background: rgba(255,255,255,0.25);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
      vertical-align: middle;
    }

  
    /* Frozen name panel */
    th.sticky-col, td.sticky-col,
    th.sticky-col-2, td.sticky-col-2 {
      position: sticky !important;
      z-index: 30 !important;
      box-shadow: 2px 0 6px rgba(0,0,0,0.08);
    }
    th.sticky-col, th.sticky-col-2 {
      z-index: 40 !important;
      background: var(--header-bg) !important;
    }
    td.sticky-col, td.sticky-col-2 {
      background: #f8fafc !important;
    }
    tbody tr:nth-child(even) td.sticky-col,
    tbody tr:nth-child(even) td.sticky-col-2 {
      background: #eef2f7 !important;
    }

  
    #perPersonTable thead th[data-code],
    #perPersonTable tbody td[data-code] {
      min-width: 42px;
      width: 42px;

    /* Marca permanente: triángulo en esquina superior derecha (opción A) */
    td.edited, .cal-day.edited, .cal-day-h.edited {
      position: relative;
    }
    td.edited::before, .cal-day.edited::before, .cal-day-h.edited::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 16px 16px 0;
      border-color: transparent #b45309 transparent transparent;
      pointer-events: none;
      z-index: 3;
    }
    td.changed, .cal-day.changed, .cal-day-h.changed { position: relative; }
    td.changed::before, .cal-day.changed::before, .cal-day-h.changed::before {
      content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0;
      border-style: solid; border-width: 0 12px 12px 0;
      border-color: transparent #2563eb transparent transparent;
      pointer-events: none; z-index: 3;
    }
    /* Titilar fuerte solo al editar (borde grueso + glow) */
    @keyframes titilar {
      0%, 100% {
        opacity: 0;
        border-color: transparent;
        box-shadow: none;

      50% {
        opacity: 1;
        border-color: #b45309;
        box-shadow:
          0 0 0 3px #b45309,
          0 0 14px 4px rgba(180, 83, 9, 0.85);
      }
    }
    td.edited::after, .cal-day.edited::after, .cal-day-h.edited::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid transparent;
      box-sizing: border-box;
      animation: titilar 0.85s ease-in-out 3;
      animation-fill-mode: forwards;
      pointer-events: none;
      z-index: 2;
    }
    @media (prefers-reduced-motion: reduce) {
      td.edited::after, .cal-day.edited::after, .cal-day-h.edited::after { animation: none; }

    .grp-card thead th.sticky-col, .grp-card thead th.sticky-col-2 { z-index: 60 !important; }

    /* Celular vertical: sin scroll vertical libre. Solo dos posiciones (tope / último jefe abajo),

    @media (orientation: portrait) and (pointer: coarse) {

    /* Columnas fijas: fondo blanco, sin rayado */

      "INT/P": "POK",
      "T/P": "POK",
      "N/P": "POK",
      "POK": "POK"
    };


    function getTextColor(bg) {
      if (!bg || ["#FFFFFF","#F2F2F2","#C6EFCE","#FFC7CE","#BDD7EE","#E2D5F1","#FFD966"].includes(bg)) return "#1a1a1a";
      const hex = bg.replace("#","");
      const r = parseInt(hex.substr(0,2),16);
      const g = parseInt(hex.substr(2,2),16);
      const b = parseInt(hex.substr(4,2),16);
      const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
      return lum > 0.55 ? "#1a1a1a" : "#ffffff";
    }

    function applyColors() {
      document.querySelectorAll("[data-code]").forEach(el => {
        const code = el.dataset.code;
        if (!code) return;
        // POK inherits T/P color if not explicitly set
        let bg = colorMap[code];
        if (!bg && code === "POK") bg = colorMap["T/P"] || colorMap["INT/P"] || colorMap["N/P"];
        if (bg) {
          el.style.background = bg;
          const hideText = code === "LIC" && !el.classList.contains("shift-option") && !el.classList.contains("blk-first");
          el.style.color = hideText ? bg : getTextColor(bg);
          if (el.classList.contains("blk")) {
            el.style.borderLeftColor = el.classList.contains("blk-first") ? "" : bg;
            el.style.borderRightColor = el.classList.contains("blk-last") ? "" : bg;
          }
        } else {
          el.style.background = "";
          el.style.color = "";
        }
      });
      document.querySelectorAll(".legend-item").forEach(item => {
        const code = item.dataset.code;
        const sw = item.querySelector(".swatch");
        if (colorMap[code]) {
          sw.style.background = colorMap[code];
        } else {
          sw.style.background = "#e2e8f0";
        }
      });
    }

    function saveMap() {
      localStorage.setItem("ctColorMap", JSON.stringify(colorMap));
    }

    // ===== Colores de CT elegidos por el admin =====
    // Se guardan como "overrides" en este dispositivo y se aplican siempre por encima
    // de los colores que traiga el JSON. Al exportar el JSON viajan dentro de "colores",
    // así que al publicarlo en GitHub les llegan a todos.
    const DEFAULT_COLORS = Object.assign({}, colorMap);
    let catalogColors = {};
    let colorOverrides = {};
    try { colorOverrides = JSON.parse(localStorage.getItem("ctColorOverrides") || "{}"); } catch (e) { colorOverrides = {}; }
    function saveColorOverrides() {
      try { localStorage.setItem("ctColorOverrides", JSON.stringify(colorOverrides)); } catch (e) {}
    }
    function applyColorOverrides() {
      Object.keys(colorOverrides).forEach(k => { colorMap[k] = colorOverrides[k]; });
    }
    function baseColor(code) {
      return catalogColors[code] || DEFAULT_COLORS[code] || "";
    }
    applyColorOverrides();

    // Según el modo de vista actual, de dónde sacar los códigos de una persona
    function codesFor(pi) {
      if (viewMode === "inicial") return INITIAL_CODES[pi] || [];
      if (viewMode === "oficial") return ORIGINAL_CODES[pi] || [];
      return people[pi].codes;
    }

    // Marca de una celda: "own" = cambio personal sin publicar (ámbar),
    // "pub" = cambio oficial publicado respecto de la programación inicial (azul), "" = sin cambios.
    function cellMark(pi, di) {
      if (viewMode === "inicial") return "";
      const shown = (codesFor(pi)[di] || "");
      if (viewMode === "actual" && shown !== ((ORIGINAL_CODES[pi] || [])[di] || "")) return "own";
      const ini = INITIAL_CODES[pi];
      if (ini && shown !== (ini[di] || "")) return "pub";
      return "";
    }
    function markClass(pi, di) {
      const m = cellMark(pi, di);
      return m === "own" ? "edited" : (m === "pub" ? "changed" : "");
    }
    function cellWasEdited(pi, fromDi, toDi) {
      if (viewMode !== "actual") return false;
      const end = toDi == null ? fromDi : toDi;
      for (let d = fromDi; d <= end; d++) {
        const cur = (people[pi].codes[d] || "");
        const orig = (ORIGINAL_CODES[pi][d] || "");
        if (cur !== orig) return true;
      }
      return false;
    }

    // Códigos que se fusionan en un solo bloque cuando aparecen varios días seguidos
    const BLOCK_CODES = ["LAO", "10A", "10J", "C/A", "LIC"];

    function buildRow(person, pi) {
      const tr = document.createElement("tr");
      tr.dataset.pi = String(pi);
      tr.innerHTML = `
        <td class="sticky-col person-id" data-pi="${pi}">${person.id}</td>
        <td class="sticky-col-2 person-name" data-pi="${pi}">${person.name}</td>
      `;
      const codesArr = codesFor(pi);
      const onlyDay = selectedDay !== null;
      let di = 0;
      while (di < codesArr.length) {
        if (onlyDay && di !== selectedDay) { di++; continue; }
        const code = codesArr[di];
        const upperCode = code ? code.toUpperCase() : "";
        const isBlock = code && BLOCK_CODES.includes(upperCode);
        const td = document.createElement("td");
        td.dataset.pi = String(pi);
        td.dataset.di = String(di);
        if (onlyDay) td.classList.add("day-only");

        if (isBlock && !onlyDay) {
          let runEnd = di;
          while (
            runEnd + 1 < codesArr.length &&
            codesArr[runEnd + 1] &&
            codesArr[runEnd + 1].toUpperCase() === upperCode
          ) {
            runEnd++;
          }
          for (let d = di; d <= runEnd; d++) {
            const c = document.createElement("td");
            c.dataset.pi = String(pi);
            c.dataset.di = String(d);
            c.dataset.code = upperCode;
            c.className = "blk" + (d === di ? " blk-first" : "") + (d === runEnd ? " blk-last" : "");
            if (d === di) c.textContent = upperCode;
            if (WEEK_START_DAYS.includes(d)) c.classList.add("week-sep");
            c.style.cursor = viewMode !== "actual" ? "default" : "pointer";
            const mk = markClass(pi, d);
            if (mk) c.classList.add(mk);
            markComment(c, pi, d);
            tr.appendChild(c);
          }
          di = runEnd + 1;
          continue;
        }

        if (!code) {
          td.className = "empty";
          td.textContent = "·";
        } else {
          td.dataset.code = code;
          td.textContent = code;
        }
        if (WEEK_START_DAYS.includes(di)) td.classList.add("week-sep");
        td.style.cursor = viewMode !== "actual" ? "default" : "pointer";
        const mk = markClass(pi, di);
        if (mk) td.classList.add(mk);
        markComment(td, pi, di);
        tr.appendChild(td);
        di++;
      }
      return tr;
    }

    // Cuántos jefes van en el Grupo 1 (el resto va al Grupo 2). Noviembre: 11 porque se fue FRANCO.
    const GROUP_SPLIT_BY_MES = { "2026-11": 11 };
    function groupSplit() { return GROUP_SPLIT_BY_MES[currentMes] != null ? GROUP_SPLIT_BY_MES[currentMes] : 12; }
    const g1 = document.getElementById("group1");
    const g2 = document.getElementById("group2");
    const daySplit = document.getElementById("daySplit");
    const scheduleTable = document.getElementById("scheduleTable");
    const dayBody1 = document.getElementById("dayBody1");
    const dayBody2 = document.getElementById("dayBody2");
    const dayHead1 = document.getElementById("dayHead1");
    const dayHead2 = document.getElementById("dayHead2");

    function groupTitleRow(text, count, cols) {
      const tr = document.createElement("tr");
      tr.className = "group-split";
      const td = document.createElement("td");
      td.colSpan = cols;
      td.textContent = text + " · " + count + " jefes";
      tr.appendChild(td);
      return tr;
    }

    function fillDayHead(el, title) {
      const wknd = WEEKEND_DAYS.includes(selectedDay) ? " weekend" : "";
      const parts = DAY_LABELS[selectedDay].split(" ");
      el.innerHTML = `<tr>
        <th class="sticky-col">Leg.</th>
        <th class="sticky-col-2">${title}</th>
        <th class="day-only${wknd}">${parts[0]}<br><span class="day-num">${parts[1]}</span></th>
      </tr>`;
    }

    function applyDayHeaderFilter() {
      const bar = document.getElementById("dayFilterBar");
      document.body.classList.toggle("day-view", selectedDay !== null);
      document.body.classList.toggle("month-view", selectedDay === null);
      if (selectedDay === null) {
        if (dayHead1) dayHead1.innerHTML = "";
        if (dayHead2) dayHead2.innerHTML = "";
        if (dayBody1) dayBody1.innerHTML = "";
        if (dayBody2) dayBody2.innerHTML = "";
        if (bar) bar.style.display = "none";
      } else if (bar) {
        bar.style.display = "block";
        const lab = document.getElementById("dayFilterLabel");
        if (lab) lab.textContent = "Sólo " + DAY_LABELS[selectedDay];
        const sortBtn = document.getElementById("btnDaySort");
        if (sortBtn) sortBtn.textContent = daySortByShift ? "Orden lista" : "Por turno";
      }
    }

    function renderGroups() {
      if (selectedDay === null) {
        const wrapEl = document.getElementById("scheduleWrap");
        const keepTop = wrapEl.scrollTop, keepLeft = wrapEl.scrollLeft;
        g1.innerHTML = "";
        g2.innerHTML = "";
        people.forEach((p, pi) => {
          const row = buildRow(p, pi);
          if (pi < groupSplit()) g1.appendChild(row);
          else g2.appendChild(row);
        });
        // Al redibujar no se pierde la posición (antes volvía al tope un instante)
        if (typeof applyMobilePos === "function" && applyMobilePos()) {
          wrapEl.scrollLeft = keepLeft;
        } else {
          wrapEl.scrollTop = keepTop;
          wrapEl.scrollLeft = keepLeft;
        }
      } else {
        dayBody1.innerHTML = "";
        dayBody2.innerHTML = "";
        if (false) { // "Orden lista" eliminado: el día se muestra siempre por turno
          fillDayHead(dayHead1, "Día");
          if (dayHead2) dayHead2.innerHTML = "";
          people.forEach((p, pi) => {
            dayBody1.appendChild(buildRow(p, pi));
          });
        } else {
          const ranked = [];
          people.forEach((p, pi) => {
            const codesArr = codesFor(pi);
            const code = codesArr[selectedDay] || "";
            const order = DAY_VIEW_ORDER.indexOf(code);
            if (order === -1) return;
            ranked.push({ pi, order });
          });
          ranked.sort((a, b) => a.order - b.order || a.pi - b.pi);
          fillDayHead(dayHead1, "Por turno");
          if (dayHead2) dayHead2.innerHTML = "";
          ranked.forEach((item) => {
            dayBody1.appendChild(buildRow(people[item.pi], item.pi));
          });
        }
      }
      applyDayHeaderFilter();
      if (typeof updatePublishBtn === "function" && fbStarted) updatePublishBtn();
    }
    function normCode(c) {
      if (c == null || c === "") return "";
      return String(c).trim().toUpperCase();
    }
    function normalizePeople(list, days) {
      const n = days || DAYS;
      return list.map(p => ({
        id: String(p.id || ""),
        name: p.name,
        codes: (Array.isArray(p.codes) ? p.codes.slice() : String(p.codes || "").split(/\s+/)).map(normCode)
      })).map(p => {
        while (p.codes.length < n) p.codes.push("");
        p.codes = p.codes.slice(0, n);
        return p;
      });
    }
    function applyCatalog(data) {
      if (!data || typeof data !== "object") return;
      if (Array.isArray(data.codigos) && data.codigos.length) {
        ALL_SHIFT_CODES = data.codigos.map(normCode).filter(Boolean);
      }
      if (data.colores && typeof data.colores === "object") {
        Object.keys(data.colores).forEach(k => {
          colorMap[normCode(k)] = data.colores[k];
          catalogColors[normCode(k)] = data.colores[k];
        });
      }
      applyColorOverrides();
      if (data.comments && typeof data.comments === "object") {
        commentsMap = Object.assign({}, data.comments, commentsMap);
        saveComments();
      }
    }

    // Trae el JSON de un mes (null si no existe o falla)
    async function fetchMes(key) {
      try {
        const r = await fetch(mesInfo(key).file + "?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return null;
        const data = await r.json();
        if (data && Array.isArray(data.people) && data.people.length) return data;
      } catch (e) {}
      return null;
    }

    // Arma el encabezado de días según el mes (cantidad de días y día de la semana del 1)
    function renderDayHead() {
      ["dayHeadRow", "dayHeadRow2"].forEach((rowId, gi) => {
        const row = document.getElementById(rowId);
        row.innerHTML = '<th class="sticky-col grp-label">GRUPO ' + (gi + 1) + '</th><th class="sticky-col-2"></th>';
        for (let d = 0; d < DAYS; d++) {
          const wd = (MES.startWd + d) % 7;
          const th = document.createElement("th");
          th.dataset.di = String(d);
          const cls = [];
          if (wd >= 5) cls.push("weekend");
          if (wd === 0 && d > 0) cls.push("week-sep");
          th.className = cls.join(" ");
          th.innerHTML = '<span class="wd">' + WEEKDAY_ABBR[wd] + '</span><span class="day-num">' + (d + 1) + "</span>";
          row.appendChild(th);
        }
      });
    }

    // Deja todo listo para mostrar un mes: fechas, título, encabezado y ediciones locales
    function setMonthGlobals(key) {
      currentMes = key;
      MES = mesInfo(key);
      DAYS = MES.days;
      DAY_LABELS = [];
      WEEKEND_DAYS = [];
      WEEK_START_DAYS = [];
      for (let d = 0; d < DAYS; d++) {
        const wd = (MES.startWd + d) % 7;
        DAY_LABELS.push(WEEKDAY_ABBR[wd] + " " + (d + 1));
        if (wd >= 5) WEEKEND_DAYS.push(d);
        if (wd === 0 && d > 0) WEEK_START_DAYS.push(d);
      }
      document.documentElement.style.setProperty("--days-total", (DAYS * 42) + "px");
      document.getElementById("titleFull").innerHTML = "<b>JEFES</b> <span class=\"m-long\">" + MES.nombre + "</span><span class=\"m-short\">" + MES_ABR[MES.m - 1].toUpperCase() + "</span> " + MES.y;
      document.getElementById("titleShort").textContent = MES.m + "/" + String(MES.y).slice(2);
      document.title = "Jefes " + MES_ABR[MES.m - 1] + " " + MES.y;
      selectedDay = null;
      daySortByShift = false;
      loadEdits();
    loadComments();
      renderDayHead();
    }

    // Programación inicial del mes (la del PDF), alineada por legajo con la lista actual.
    // Prioridad: la guardada en Firebase junto a la versión oficial; si no, la semilla del HTML.
    function initialFor(key, data) {
      let src = null;
      if (data && Array.isArray(data.inicial) && data.inicial.length) src = data.inicial;
      else if (SEED_BY_MES[key]) src = SEED_BY_MES[key];
      if (!src) return null;
      const list = normalizePeople(src, mesInfo(key).days);
      const byId = {};
      list.forEach(p => { if (p.id) byId[p.id] = p.codes; });
      return people.map((p, i) => (byId[p.id] || ORIGINAL_CODES[i] || []).slice());
    }

    // Muestra un mes: usa el JSON publicado si existe, si no la semilla incluida en el HTML
    function switchMonth(key) {
      setMonthGlobals(key);
      const data = loadFbCache(key) || MES_DATA[key];
      ALL_SHIFT_CODES = DEFAULT_SHIFT_CODES.slice();
      if (data) {
        applyCatalog(data);
        people = normalizePeople(data.people);
      } else {
        people = normalizePeople(SEED_BY_MES[key]);
      }
      ORIGINAL_CODES = people.map(p => p.codes.slice());
      const ini = initialFor(key, data);
      if (ini) {
        INITIAL_CODES = ini;
      } else {
        // Mes sin semilla: la primera versión publicada que vio este dispositivo queda como "inicial"
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem("ctInitial:" + key) || "null"); } catch (e) {}
        if (!Array.isArray(saved)) {
          saved = ORIGINAL_CODES.map(c => c.slice());
          try { localStorage.setItem("ctInitial:" + key, JSON.stringify(saved)); } catch (e) {}
        }
        INITIAL_CODES = saved;
      }
      resetPeopleFromOfficial();
      renderGroups();
      buildShiftGrid();
      applyColors();
    }

    // Vuelve a traer el JSON del mes que se está viendo (auto-actualización)
    async function loadSharedSchedule() {
      const mes = currentMes;
      const data = await fetchMes(mes);
      if (mes !== currentMes) return; // cambiaron de mes mientras cargaba
      if (data) {
        MES_DATA[mes] = data;
        applyCatalog(data);
        people = normalizePeople(data.people);
        ORIGINAL_CODES = people.map(p => p.codes.slice());
      }
      resetPeopleFromOfficial();
      renderGroups();
      buildShiftGrid();
      applyColors();
    }

    // ---- Meses disponibles ----
    const MES_DATA = {};        // JSON publicado ya traído, por mes
    let AVAILABLE_MESES = [];

    function mesKeyOf(y, m) { return y + "-" + String(m).padStart(2, "0"); }
    // Meses a probar: desde 5 meses atrás (sin bajar de septiembre 2026) hasta 2 meses adelante
    function candidateMeses() {
      const now = new Date();
      const nowIdx = now.getFullYear() * 12 + now.getMonth();
      const [fy, fm] = FIRST_MES.split("-").map(Number);
      const start = Math.max(fy * 12 + fm - 1, nowIdx - 5);
      const end = Math.max(nowIdx + 2, 2026 * 12 + 9); // como mínimo hasta octubre 2026
      const out = [];
      for (let i = start; i <= end; i++) out.push(mesKeyOf(Math.floor(i / 12), (i % 12) + 1));
      return out;
    }

    function fillMonthSelect() {
      const sel = document.getElementById("monthSelect");
      sel.innerHTML = "";
      AVAILABLE_MESES.forEach(k => {
        const mi = mesInfo(k);
        const o = document.createElement("option");
        o.value = k;
        o.textContent = MES_ABR[mi.m - 1] + " " + mi.y;
        sel.appendChild(o);
      });
      sel.style.display = AVAILABLE_MESES.length > 1 ? "" : "none";
      sel.value = currentMes;
    }
    document.getElementById("monthSelect").addEventListener("change", (e) => {
      const key = e.target.value;
      try { sessionStorage.setItem("jefesMes", key); } catch (err) {}
      switchMonth(key);
    });

    async function initApp() {
      const cands = candidateMeses();
      const results = await Promise.all(cands.map(k => fetchMes(k)));
      cands.forEach((k, i) => { if (results[i]) MES_DATA[k] = results[i]; });
      AVAILABLE_MESES = cands.filter(k => MES_DATA[k] || SEED_BY_MES[k] || loadFbCache(k));
      if (!AVAILABLE_MESES.length) AVAILABLE_MESES = [FIRST_MES];
      let want = null;
      try { want = sessionStorage.getItem("jefesMes"); } catch (e) {}
      if (!want || !AVAILABLE_MESES.includes(want)) {
        const now = new Date();
        const today = mesKeyOf(now.getFullYear(), now.getMonth() + 1);
        want = AVAILABLE_MESES.includes(today) ? today : AVAILABLE_MESES[AVAILABLE_MESES.length - 1];
      }
      switchMonth(want);
      fillMonthSelect();
      startFirebase();
    }
    initApp();

    // Auto-actualización: cada cierto tiempo vuelve a traer el JSON del mes que se está viendo,
    // así los dispositivos que ya tienen la página abierta reciben los cambios solos.
    const AUTO_REFRESH_MS = 3 * 60 * 1000; // cada 3 minutos
    setInterval(() => {
      const openOverlay = document.querySelector(".palette-overlay.open, #loginOverlay.open");
      if (openOverlay) return; // no interrumpir si hay un modal abierto (editando un turno, login, etc.)
      if (fbReady) return; // con Firebase los cambios llegan solos en tiempo real
      loadSharedSchedule();
    }, AUTO_REFRESH_MS);

    // Además de traer el JSON, cada cierto tiempo recarga la página entera saltando
    // la caché del celular. Esto asegura que si el propio HTML/código cambió (no solo
    // los datos), el celular lo termine tomando solo sin que haya que reinstalarla.
    const FULL_RELOAD_MS = 20 * 60 * 1000; // cada 20 minutos
    setInterval(() => {
      const openOverlay = document.querySelector(".palette-overlay.open, #loginOverlay.open");
      if (openOverlay) return;
      location.replace(location.pathname + "?v=" + Date.now());
    }, FULL_RELOAD_MS);

    let currentUser = fbReady ? "" : (sessionStorage.getItem("jefesUser") || "");
    function setAdminUI() {
      document.body.classList.toggle("is-admin", currentUser === "ADMIN");
      document.getElementById("btnUser").title = currentUser === "ADMIN" ? "Admin (salir)" : "Usuario";
    }
    setAdminUI();
    const loginOverlay = document.getElementById("loginOverlay");
    function leaveInicialView() {
      if (viewMode === "inicial") {
        viewMode = "actual";
        btnOriginalView.textContent = "A";
        btnOriginalView.title = "Actual (editable)";
        btnOriginalView.style.background = "#7c3aed";
        refreshAfterEdit();
      }
    }
    document.getElementById("btnUser").addEventListener("click", () => {
      if (fbReady) {
        if (fbAuth.currentUser) {
          if (confirm("¿Cerrar sesión de " + (fbAuth.currentUser.email || "Google") + "?")) fbAuth.signOut();
          return;
        }
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        fbAuth.signInWithPopup(provider).catch(err => {
          const code = err && err.code || "";
          if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
          if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
            fbAuth.signInWithRedirect(provider);
            return;
          }
          alert("No se pudo entrar con Google (" + code + ").");
        });
        return;
      }
      if (currentUser === "ADMIN") {
        if (confirm("¿Cerrar sesión de admin?")) {
          currentUser = "";
          sessionStorage.removeItem("jefesUser");
          if (viewMode === "inicial") {
            viewMode = "actual";
            btnOriginalView.textContent = "A";
            btnOriginalView.title = "Actual (editable)";
            btnOriginalView.style.background = "#7c3aed";
            refreshAfterEdit();
          }
          setAdminUI();
        }
        return;
      }
      document.getElementById("loginErr").textContent = "";
      document.getElementById("loginPass").value = "";
      loginOverlay.classList.add("open");
      document.getElementById("loginPass").focus();
    });
    document.getElementById("loginCancel").addEventListener("click", () => loginOverlay.classList.remove("open"));
    loginOverlay.addEventListener("click", (e) => {
      if (e.target === loginOverlay) loginOverlay.classList.remove("open");
    });
    document.getElementById("loginGo").addEventListener("click", () => {
      const pw = document.getElementById("loginPass").value;
      if (pw === "1318") {
        currentUser = "ADMIN";
        sessionStorage.setItem("jefesUser", "ADMIN");
        setAdminUI();
        loginOverlay.classList.remove("open");
      } else {
        document.getElementById("loginErr").textContent = "Clave incorrecta";
      }
    });
    document.getElementById("loginPass").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("loginGo").click();
    });

    // ========== FIREBASE: lectura en tiempo real y publicación ==========
    function fbCacheKey(key) { return "ctFb:" + key; }
    function loadFbCache(key) {
      try {
        const d = JSON.parse(localStorage.getItem(fbCacheKey(key)) || "null");
        return d && Array.isArray(d.people) && d.people.length ? d : null;
      } catch (e) { return null; }
    }
    function saveFbCache(key, data) {
      try { localStorage.setItem(fbCacheKey(key), JSON.stringify(data)); } catch (e) {}
    }

    // Llega una versión oficial nueva de un mes (el admin tocó "Publicar").
    // Regla: TODAS las ediciones personales de ese mes se descartan y todos ven
    // exactamente la versión del admin. Los comentarios no se tocan (son personales).
    function applyOfficialUpdate(key, data) {
      if (!data || !Array.isArray(data.people) || !data.people.length) return;
      const days = mesInfo(key).days;
      const prevSrc = loadFbCache(key);
      if (prevSrc && prevSrc.version && data.version && prevSrc.version === data.version) return; // ya la tenía
      const next = normalizePeople(data.people, days);
      const em = {};
      try { localStorage.setItem(editsKey(key), JSON.stringify(em)); } catch (e) {}
      saveFbCache(key, data);

      if (!AVAILABLE_MESES.includes(key)) {
        AVAILABLE_MESES.push(key);
        AVAILABLE_MESES.sort();
        fillMonthSelect();
      }
      if (key === currentMes) {
        editsMap = em;
        ALL_SHIFT_CODES = DEFAULT_SHIFT_CODES.slice();
        applyCatalog(data);
        people = next;
        ORIGINAL_CODES = people.map(p => p.codes.slice());
        const ini = initialFor(key, data);
        if (ini) INITIAL_CODES = ini;
        resetPeopleFromOfficial();
        renderGroups();
        buildShiftGrid();
        applyColors();
        if (personOverlay.classList.contains("open") && currentCalPi !== null) openPersonCalendar(currentCalPi);
      }
    }

    let fbStarted = false;
    function startFirebase() {
      if (!fbReady || fbStarted) return;
      fbStarted = true;
      document.body.classList.add("fb-on");
      fbDb.collection("jefes").onSnapshot(qs => {
        qs.docChanges().forEach(ch => {
          if (ch.type === "removed") return;
          applyOfficialUpdate(ch.doc.id, ch.doc.data());
        });
      }, err => { console.warn("Firebase:", err); });
      fbAuth.onAuthStateChanged(u => {
        const email = u && u.email ? u.email.toLowerCase() : "";
        const isAdmin = !!email && !!ADMIN_EMAIL && email === ADMIN_EMAIL.toLowerCase();
        if (u && !isAdmin) {
          alert("La cuenta " + email + " no tiene permiso para publicar.");
          fbAuth.signOut();
        }
        currentUser = isAdmin ? "ADMIN" : "";
        if (!isAdmin) leaveInicialView();
        setAdminUI();
        updatePublishBtn();
      });
    }

    // Cuántas diferencias hay entre lo que ve el admin y la versión oficial
    function pendingCount() {
      let n = 0;
      people.forEach((p, pi) => {
        for (let d = 0; d < DAYS; d++) {
          if ((p.codes[d] || "") !== ((ORIGINAL_CODES[pi] || [])[d] || "")) n++;
        }
      });
      return n + Object.keys(colorOverrides).length;
    }

      const btn = document.getElementById("btnPublish");
      if (!btn || btn.disabled) return;
      const n = pendingCount();
      btn.textContent = n ? "⬆ Publicar (" + n + ")" : "⬆ Publicar";
      btn.classList.toggle("pending", n > 0);
    }

        : "No hay cambios respecto a la versión oficial. ¿Publicar " + MES.nombre + " igual?";
      if (!confirm(msg)) return;
      const btn = document.getElementById("btnPublish");

      btn.textContent = "Publicando…";

        people: people.map(p => ({ id: p.id, name: p.name, codes: p.codes.slice() })),
        inicial: people.map((p, i) => ({ id: p.id, name: p.name, codes: (INITIAL_CODES[i] || p.codes).slice() }))
      };
      try {

      const jsonText = JSON.stringify(currentJson(), null, 2);
      const blob = new Blob([jsonText], { type: "application/json" });

      // En el celular, "compartir" es más confiable que la descarga (Safari suele
      // abrir el JSON como texto en vez de guardarlo con el attribute "download").
      let file = null;
      try { file = new File([blob], MES.file, { type: "application/json" }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: MES.file });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return; // el usuario canceló el panel de compartir
        }
      }

      // Escritorio / navegadores sin Web Share: descarga normal
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = MES.file;
      a.click();
      URL.revokeObjectURL(a.href);

    document.getElementById("btnCopyJson").addEventListener("click", async () => {

        btn.textContent = "✓ Copiado";
        setTimeout(() => { btn.textContent = prev; }, 1500);
      };
      try {
        await navigator.clipboard.writeText(jsonText);
        marcarCopiado();
      } catch (err) {
        // Fallback para navegadores que no permiten el portapapeles moderno
        const ta = document.createElement("textarea");
        ta.value = jsonText;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand("copy"); marcarCopiado(); } catch (e2) {

    document.getElementById("importJsonFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const list = Array.isArray(data) ? data : data.people;
          if (!list || !list.length) throw new Error("sin people");
          if (data.mes && data.mes !== currentMes &&
              !confirm("Este JSON es de " + data.mes + " pero estás viendo " + currentMes + ". ¿Importarlo igual?")) return;
          applyCatalog(data);
          try { saveMap(); } catch (err) {}
          // Lo importado se guarda como ediciones locales sobre la programación publicada,
          // así sobrevive al cerrar/abrir la app y a la auto-actualización desde GitHub.
          const imported = normalizePeople(list);
          const norm = s => String(s || "").trim().toUpperCase();
          const used = new Set();
          const findIdx = (ip, ii) => {
            let idx = ip.id ? people.findIndex((p, k) => !used.has(k) && p.id && String(p.id) === ip.id) : -1;
            if (idx < 0) idx = people.findIndex((p, k) => !used.has(k) && norm(p.name) === norm(ip.name));
            if (idx < 0 && people[ii] && !used.has(ii)) idx = ii;
            return idx;
          };
          const newEdits = {};
          const newComments = {};
          const srcComments = (data.comments && typeof data.comments === "object") ? data.comments : {};
          let noEncontrados = [];
          imported.forEach((ip, ii) => {
            const pi = findIdx(ip, ii);
            if (pi < 0 || !ORIGINAL_CODES[pi]) { noEncontrados.push(ip.name); return; }
            used.add(pi);
            for (let di = 0; di < DAYS; di++) {
              const code = ip.codes[di] || "";
              if (code !== (ORIGINAL_CODES[pi][di] || "")) newEdits[pi + ":" + di] = code;
              const c = srcComments[ii + ":" + di];
              if (c) newComments[pi + ":" + di] = c;
            }
          });
          editsMap = newEdits;
          try { localStorage.setItem(editsKey(currentMes), JSON.stringify(editsMap)); } catch (err) {}
          commentsMap = newComments;
          saveComments();
          resetPeopleFromOfficial();
          renderGroups();
          buildShiftGrid();
          applyColors();
          let msg = "JSON importado y guardado en este dispositivo.\n\nPara que lo vean todos, subí ese mismo archivo a GitHub como " + MES.file;
          if (noEncontrados.length) msg += "\n\nNo se encontraron en la programación publicada: " + noEncontrados.join(", ");
          alert(msg);
        } catch (err) {
          alert("JSON inválido");
        }
      };
      reader.readAsText(file);
    });

    // ========== COMPARTIR ALMANAQUE POR WHATSAPP (imagen, sin puntitos de comentario) ==========
    const CAL_FONT = "'Segoe UI', system-ui, -apple-system, sans-serif";
    function calRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }
    // Dibuja una celda igual que en pantalla: fondo, borde, textos y marca de editado
    function calDrawCell(ctx, x, y, w, h, bg, fg, edited, lines) {
      calRoundRect(ctx, x, y, w, h, 8);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#e5e7eb";
      ctx.stroke();
      if (edited) {
        ctx.save();
        calRoundRect(ctx, x, y, w, h, 8);
        ctx.clip();
        ctx.beginPath();
        ctx.moveTo(x + w - 16, y);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w, y + 16);
        ctx.closePath();
        ctx.fillStyle = edited === "pub" ? "#2563eb" : "#b45309";
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = fg;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const totalH = lines.reduce((s, l) => s + l.h, 0);
      let cy = y + (h - totalH) / 2;
      lines.forEach(l => {
        ctx.globalAlpha = l.alpha == null ? 1 : l.alpha;
        ctx.font = l.font;
        ctx.fillText(l.text, x + w / 2, cy + l.h / 2);
        cy += l.h;
      });
      ctx.globalAlpha = 1;
    }

    function buildPersonCalCanvas(pi) {
      const person = people[pi];
      const codesArr = codesFor(pi);
      const isRow = calViewMode === "horizontal";
      const PAD = 16, TITLE_H = 30, SUB_H = 22;
      const SCALE = 2;

      let cellW, cellH, gap, cols, rows, headH;
      if (isRow) {
        cellW = 58; cellH = 100; gap = 5; cols = DAYS; rows = 1; headH = 0;
      } else {
        cellW = 64; cellH = 56; gap = 4; cols = 7;
        rows = Math.ceil((MES.startWd + DAYS) / 7); headH = 20;
      }
      const W = PAD * 2 + cols * cellW + (cols - 1) * gap;
      const H = PAD + TITLE_H + SUB_H + headH + rows * cellH + (rows - 1) * gap + PAD;

      const canvas = document.createElement("canvas");
      canvas.width = W * SCALE;
      canvas.height = H * SCALE;
      const ctx = canvas.getContext("2d");
      ctx.scale(SCALE, SCALE);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);

      // Título (igual que la ventana) + mes
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#1e293b";
      ctx.font = "700 17px " + CAL_FONT;
      ctx.fillText(person.name + " · " + person.id, PAD, PAD + TITLE_H / 2);
      ctx.fillStyle = "#64748b";
      ctx.font = "600 12px " + CAL_FONT;
      ctx.fillText(MES.nombre + " " + MES.y, PAD, PAD + TITLE_H + SUB_H / 2 - 4);

      let top = PAD + TITLE_H + SUB_H;
      if (!isRow) {
        ctx.fillStyle = "#64748b";
        ctx.font = "700 11px " + CAL_FONT;
        ctx.textAlign = "center";
        WEEKDAY_ABBR.forEach((wd, i) => {
          ctx.fillText(wd, PAD + i * (cellW + gap) + cellW / 2, top + headH / 2 - 2);
        });
        top += headH;
      }

      for (let d = 0; d < DAYS; d++) {
        const code = codesArr[d] || "";
        const bg = code ? (colorMap[code] || "#e2e8f0") : "#f8fafc";
        const fg = code ? getTextColor(bg) : "#94a3b8";
        const edited = cellMark(pi, d);
        let x, y, lines;
        if (isRow) {
          x = PAD + d * (cellW + gap);
          y = top;
          const wd = WEEKDAY_ABBR[(MES.startWd + d) % 7];
          lines = [
            { text: wd, font: "600 13px " + CAL_FONT, h: 15, alpha: 0.85 },
            { text: String(d + 1), font: "600 13px " + CAL_FONT, h: 15, alpha: 0.85 },
            { text: code || "·", font: "800 18px " + CAL_FONT, h: 29 }
          ];
        } else {
          const slot = MES.startWd + d;
          x = PAD + (slot % 7) * (cellW + gap);
          y = top + Math.floor(slot / 7) * (cellH + gap);
          lines = [
            { text: String(d + 1), font: "900 13px " + CAL_FONT, h: 17, alpha: 0.8 },
            { text: code || "·", font: "600 12px " + CAL_FONT, h: 16 }
          ];
        }
        calDrawCell(ctx, x, y, cellW, cellH, bg, fg, edited, lines);
      }
      return canvas;
    }

    const btnShareCal = document.getElementById("btnShareCal");
    btnShareCal.addEventListener("click", async () => {
      if (currentCalPi == null) return;
      btnShareCal.disabled = true;
      try {
        const person = people[currentCalPi];
        const canvas = buildPersonCalCanvas(currentCalPi);
        const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
        if (!blob) throw new Error("sin imagen");
        const slug = person.name.normalize("NFD").replace(/[̀-ͯ]/g, "")
          .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
        const fname = "turnos-" + slug + "-" + MES.nombre.toLowerCase() + "-" + MES.y + ".png";
        let file = null;
        try { file = new File([blob], fname, { type: "image/png" }); } catch (e) {}

        // Celular: abre el panel de compartir, donde se elige WhatsApp.
        // En la compu NO se usa (el panel de Windows se queda colgado).
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (isMobile && file && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        // Computadora: copia la imagen al portapapeles (para pegar con Ctrl+V en WhatsApp Web)
        let copied = false;
        if (!isMobile && navigator.clipboard && window.ClipboardItem) {
          try {
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
            copied = true;
          } catch (e) {}
        }

        // y además la descarga
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        alert(copied
          ? "Imagen copiada. En WhatsApp abrí el chat y pegala con Ctrl+V.\n(También quedó descargada.)"
          : "Se descargó la imagen del almanaque. Adjuntala en WhatsApp.");
      } catch (e) {
        alert("No se pudo generar la imagen.");
      } finally {
        btnShareCal.disabled = false;
      }
    });
    btnToggleCalView.addEventListener("click", () => {
      calViewMode = calViewMode === "horizontal" ? "grid" : "horizontal";
      try { localStorage.setItem("jefesCalView", calViewMode); } catch (e) {}
      applyCalViewMode();
    });
    document.getElementById("closePersonCal").addEventListener("click", closePersonCalendar);
    personOverlay.addEventListener("click", (e) => {
      if (e.target === personOverlay) closePersonCalendar();
    });
    personCalGrid.addEventListener("click", (e) => {
      const cell = e.target.closest(".cal-day[data-di]");
      if (!cell || viewMode !== "actual") return;
      openShiftPicker(Number(cell.dataset.pi), Number(cell.dataset.di));
    });
    personCalRow.addEventListener("click", (e) => {
      const cell = e.target.closest(".cal-day-h[data-di]");
      if (!cell || viewMode !== "actual") return;
      openShiftPicker(Number(cell.dataset.pi), Number(cell.dataset.di));
    });

    document.addEventListener("click", (e) => {
      const cell = e.target.closest("td.person-name, td.person-id");
      if (!cell) return;
      openPersonCalendar(Number(cell.dataset.pi));
    });

    // ========== CELULAR VERTICAL: DOS POSICIONES ==========
    // Grupo 1 tocado -> tabla arriba del todo.
    // Grupo 2 tocado -> la tabla SUBE hasta que el último jefe (PEREYRA) queda visible abajo.
    // No se usa el scroll vertical del navegador (que se "resetea" al redibujar y producía
    // el sube y baja): las tarjetas se corren con un desplazamiento que maneja solo la app.
    const mobilePosMq = window.matchMedia("(orientation: portrait) and (pointer: coarse)");
    let mobilePos = "top";
    let mobileOffset = 0;
    function mobileCards() { return document.querySelectorAll("#scheduleWrap .grp-card"); }
    function computeMobileOffset() {
      if (mobilePos !== "bottom") return 0;
      const wrap = document.getElementById("scheduleWrap");
      const lastRow = document.querySelector("#group2 tr:last-child");
      if (!lastRow) return 0;
      const wr = wrap.getBoundingClientRect();
      const rr = lastRow.getBoundingClientRect();
      const bottomSinCorrer = rr.bottom - wr.top + mobileOffset; // dónde estaría PEREYRA sin desplazar
      return Math.max(0, Math.ceil(bottomSinCorrer + 12 - wrap.clientHeight));
    }
    function setMobileOffset(px, animate) {
      mobileOffset = px;
      mobileCards().forEach(c => {
        c.style.transition = animate ? "transform 0.22s ease-out" : "none";
        c.style.transform = px ? "translateY(" + (-px) + "px)" : "";
      });
    }
    function applyMobilePos() {
      if (!mobilePosMq.matches) {
        if (mobileOffset) setMobileOffset(0, false);
        return false;
      }
      const wrap = document.getElementById("scheduleWrap");
      if (wrap.scrollTop) wrap.scrollTop = 0;
      const px = computeMobileOffset();
      if (px !== mobileOffset) setMobileOffset(px, false);
      return true;
    }
    (function () {
      const wrap = document.getElementById("scheduleWrap");
      let startCard = null;
      wrap.addEventListener("touchstart", (e) => {
        startCard = mobilePosMq.matches ? e.target.closest(".grp-card") : null;
      }, { passive: true });
      wrap.addEventListener("touchend", () => {
        if (!startCard) return;
        const cards = mobileCards();
        mobilePos = startCard === cards[1] ? "bottom" : "top";
        startCard = null;
        const px = computeMobileOffset();
        if (px !== mobileOffset) setMobileOffset(px, true);
      }, { passive: true });
      // Si el navegador intenta desplazar verticalmente por su cuenta, se anula
      wrap.addEventListener("scroll", () => {
        if (mobilePosMq.matches && wrap.scrollTop) wrap.scrollTop = 0;
      }, { passive: true });
      // Cambio de tamaño (barra del navegador, girar el celular): recalcula sin animar
      window.addEventListener("resize", () => applyMobilePos());
    })();

    // ========== PALETA DE COLORES DE LOS CT (solo admin) ==========
    const colorOverlay = document.getElementById("colorOverlay");
    const colorCodeGrid = document.getElementById("colorCodeGrid");
    const colorPaletteGrid = document.getElementById("colorPaletteGrid");
    const customColor = document.getElementById("customColor");
    let colorEditCode = null;

    function codeBg(code) {
      let bg = colorMap[code];
      if (!bg && code === "POK") bg = colorMap["T/P"] || colorMap["INT/P"] || colorMap["N/P"];
      return bg || "";
    }
    function renderColorEditor() {
      colorCodeGrid.innerHTML = "";
      ALL_SHIFT_CODES.forEach(code => {
        const opt = document.createElement("div");
        opt.className = "shift-option" + (code === colorEditCode ? " selected" : "");
        opt.textContent = code;
        const bg = codeBg(code);
        if (bg) { opt.style.background = bg; opt.style.color = getTextColor(bg); }
        if (bg.toUpperCase() === "#FFFFFF" && code !== colorEditCode) opt.style.borderColor = "#cbd5e1";
        opt.addEventListener("click", () => { colorEditCode = code; renderColorEditor(); });
        colorCodeGrid.appendChild(opt);
      });
      const cur = colorEditCode ? (codeBg(colorEditCode) || "").toUpperCase() : "";
      colorPaletteGrid.innerHTML = "";
      PALETTE.forEach(hex => {
        const sw = document.createElement("div");
        sw.className = "palette-color" + (cur === hex.toUpperCase() ? " selected" : "");
        sw.style.background = hex;
        sw.style.border = hex.toUpperCase() === "#FFFFFF" ? "2px solid #e2e8f0" : "";
        if (cur === hex.toUpperCase()) sw.style.border = "";
        sw.addEventListener("click", () => setCodeColor(hex));
        colorPaletteGrid.appendChild(sw);
      });
      const off = !colorEditCode;
      colorPaletteGrid.style.opacity = off ? "0.35" : "1";
      colorPaletteGrid.style.pointerEvents = off ? "none" : "";
      customColor.disabled = off;
      document.getElementById("resetCodeColor").disabled = off;
      if (cur && /^#[0-9A-F]{6}$/.test(cur)) customColor.value = cur.toLowerCase();
      document.getElementById("colorStep2").textContent = colorEditCode
        ? "2. Elegí el color para " + colorEditCode
        : "2. Elegí el color";
    }
    function afterColorChange() {
      saveColorOverrides();
      try { saveMap(); } catch (e) {}
      renderGroups();
      buildShiftGrid();
      applyColors();
      if (personOverlay.classList.contains("open") && currentCalPi !== null) openPersonCalendar(currentCalPi);
      renderColorEditor();
    }
    function setCodeColor(hex) {
      if (!colorEditCode) return;
      colorMap[colorEditCode] = hex;
      colorOverrides[colorEditCode] = hex;
      afterColorChange();
    }
    customColor.addEventListener("input", () => setCodeColor(customColor.value.toUpperCase()));
    document.getElementById("resetCodeColor").addEventListener("click", () => {
      if (!colorEditCode) return;
      delete colorOverrides[colorEditCode];
      const base = baseColor(colorEditCode);
      if (base) colorMap[colorEditCode] = base; else delete colorMap[colorEditCode];
      afterColorChange();
    });
    function closeColors() { colorOverlay.classList.remove("open"); }
    document.getElementById("btnColors").addEventListener("click", () => {
      if (currentUser !== "ADMIN") return;
      colorEditCode = null;
      renderColorEditor();
      colorOverlay.classList.add("open");
    });
    document.getElementById("closeColors").addEventListener("click", closeColors);
    document.getElementById("doneColors").addEventListener("click", closeColors);
    colorOverlay.addEventListener("click", (e) => { if (e.target === colorOverlay) closeColors(); });
</script>
</body>
</html>
